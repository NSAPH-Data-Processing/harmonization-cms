  ps:
    name: "ps"
    description: "Patient Summary view combining multiple MBSF files"
    path_pattern: 
      - "{basepath}/{year}/mbsf_ab*/part-*.parquet"
      - "{basepath}/{year}/dnm/part-*.parquet"
      - "{basepath}/{year}/dn100__1/part-*.parquet"
      - "{basepath}/{year}/denominator_file/part-*.parquet"
      - "{basepath}/{year}/den/part-*.parquet"
    columns:
      - bene_id:
          source:
          - bene_id
          - intbid # sas beneid
      - year:
          source: 
          - rfrnc_yr
          - enrolyr
          cast:
            '*': >
              CASE 
                WHEN {column_name}::int < 20 THEN (2000 + {column_name}::int) 
                WHEN (20 < {column_name}::int AND {column_name}::int < 100) THEN (1900 + {column_name}::int) 
                WHEN {column_name} IS NULL THEN 2000 
                ELSE {column_name}::int 
              END
      - zip:
          source: 
          - BENE_ZIP
          - ZIPCODE
          type: INT
          cast:
            numeric: "(CASE WHEN {column_name} < 100000 THEN {column_name}::int ELSE ({column_name}/10000)::INT END)"
            "character varying": "SUBSTRING({column_name} FROM 1 FOR 5)::INT"
            integer: "{column_name}::INT"
      - state:
          source: 
          - STATE_CD
          - STATE
          type: CHAR(2)
      - dob:
          type: date
          description: Date of birth
          cast:
            "character varying": "STRPTIME({column_name}, '%Y%m%d')"
            numeric: "STRPTIME(LPAD(CAST({column_name} AS VARCHAR), 8, '0'), '%Y%m%d')"
          source:
            - BENE_DOB
            - DOB
            # - bene_birth_dt
      - age:
          type: INT
          description: Age on January 1 of a given year, if provided
          optional: true
          source:
            - AGE
            # - bene_age_at_beg_ref_yr
          cast:
            '*': "{column_name}::INT"
      - dod:
          type: date
          description: Date of beneficiary death, if available
          cast:
            "character varying": >
              CASE 
                WHEN {column_name} = '00000000' THEN NULL 
                ELSE STRPTIME({column_name}, '%Y%m%d') 
              END

            numeric: >
              CASE 
                WHEN {column_name} < 19000000 THEN NULL 
                ELSE STRPTIME(LPAD(CAST({column_name} AS VARCHAR), 8, '0'), '%Y%m%d') 
              END
          source:
            - DEATH_DT
            - BEF_DOD
            # - bene_dod
            # - bene_death_dt
      - county:
          type: VARCHAR
          description: CMS provided county code
          source:
            - CNTY_CD
            # - sas_county # no county column in sas dnm file
            # - bene_age_at_beg_ref_yr
          cast:
            '*': "{column_name}::VARCHAR"
      - sex:
          reference: https://resdac.org/cms-data/variables/sex-beneficiary-0
          type: VARCHAR
          cast:
            '*': "{column_name}::VARCHAR"
          source:
            - SEX
            # - bene_sex_ident_cd
      - race:
          reference: https://resdac.org/cms-data/variables/beneficiary-race-code-ffs
          type: VARCHAR
          cast:
            '*': "{column_name}::VARCHAR"
          source:
            # - bene_race_cd
            - RACE
      - dod_ndi: # not in sas
          description: This variable is the date of death as reported on the Beneficiary’s death certificate.
          reference: https://resdac.org/cms-data/variables/ndi-date-deathmbsf
          # optional: true
          source:  NDI_DEATH_DT
          type: DATE
      - race_rti: # not in sas
          description: Research Triangle Institute (RTI) Race Code
          reference: https://resdac.org/cms-data/variables/research-triangle-institute-rti-race-code
          # optional: true
          source: RTI_RACE_CD
