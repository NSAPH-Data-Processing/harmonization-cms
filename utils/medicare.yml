  ps:
    name: "ps"
    description: "Patient Summary view combining multiple MBSF files"
    path_pattern: 
      - "{basepath}/{year}/mbsf_ab*/part-*.parquet"
      - "{basepath}/{year}/dnm/part-*.parquet"
      - "{basepath}/{year}/dn100__1/part-*.parquet"
      - "{basepath}/{year}/denominator_file/part-*.parquet"
      - "{basepath}/{year}/den/part-*.parquet"
    columns:
      - bene_id:
          source:
          - bene_id
          - intbid  # "beneid" for 1999 - 2002 (pre processed sas)
          - bid_5333_1 # "beneid" for 2003 - 2005 (pre processed sas)
          - bid_5333_3 # "beneid" for 2006 (pre processed sas)
          cast:
            '*': "{column_name}::VARCHAR"
      - year:
          source: 
          - rfrnc_yr # 2003, 2004, 2005, 2006, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018
          - enrolyr # 1999, 2000, 2001, 2002
          - enroll_yr # 2009, 2010
          - bene_enrollmt_ref_yr # 2007, 2008
          cast:
            '*': >
              CASE 
                WHEN TRY_CAST({column_name} AS INT) < 20 THEN 2000 + TRY_CAST({column_name} AS INT)
                WHEN TRY_CAST({column_name} AS INT) >= 20 AND TRY_CAST({column_name} AS INT) < 100 THEN 1900 + TRY_CAST({column_name} AS INT)
                ELSE TRY_CAST({column_name} AS INT)
              END

      - zip:
          source: 
          - bene_zip # 2003, 2004, 2005, 2006, 2011, 2012, 2013, 2014
          - bene_zip_cd # 2007, 2008
          - zip # 2009, 2010
          - zipcode # 1999, 2000, 2001, 2002
          - zip_cd # 2015, 2016, 2017, 2018
          type: INT
          cast:
            '*': "TRY_CAST({column_name} AS INT)"
      - state:
          source: 
          - state_cd # 2003, 2004, 2005, 2006, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018
          - state # 1999, 2000, 2001, 2002
          - state_code # 2007, 2008
          - ssa_state # 2009, 2010
          type: INT
      - dob:
          type: date
          description: Date of birth
          cast:
            VARCHAR: "CASE WHEN {column_name} ~ '^[0-9]{{8}}$' AND {column_name} NOT IN ('00000000') THEN STRPTIME({column_name}, '%Y%m%d') ELSE NULL END"
            DOUBLE: "CASE WHEN {column_name} >= 19000000 THEN STRPTIME(LPAD(CAST({column_name} AS VARCHAR), 8, '0'), '%Y%m%d') ELSE NULL END"
          source:
            - bene_dob # 2003, 2004, 2005, 2006, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018
            - dob # 1999, 2000, 2001, 2002
            - bene_birth_dt # 2007, 2008
      - age:
          type: INT
          description: Age on January 1 of a given year, if provided
          optional: true
          source:
            - age # 1999, 2000, 2001, 2002, 2003, 2004, 2005, 2006, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018
            - bene_age_at_beg_ref_yr # 2007, 2008
          cast:
            '*': "{column_name}::INT"
      - dod:
          type: date
          description: Date of beneficiary death, if available
          cast:
            VARCHAR: "CASE WHEN {column_name} ~ '^[0-9]{{8}}$' AND {column_name} NOT IN ('00000000') THEN STRPTIME({column_name}, '%Y%m%d') ELSE NULL END"
            DOUBLE: "CASE WHEN {column_name} >= 19000000 THEN STRPTIME(LPAD(CAST({column_name} AS VARCHAR), 8, '0'), '%Y%m%d') ELSE NULL END"
          source:
            - death_dt # 2003, 2004, 2005, 2006, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018
            - bef_dod # 1999, 2000, 2001, 2002
            - bene_dod # 2009, 2010
            - bene_death_dt # 2007, 2008
      - county:
          type: VARCHAR
          description: CMS provided county code
          source: # no county code for 1999 - 2002
            - cnty_cd # 2003, 2004, 2005, 2006, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018
            - bene_county_cd # 2007, 2008
            - ssa_county # 2009, 2010
          cast:
            '*': "{column_name}::VARCHAR"
      - sex:
          reference: https://resdac.org/cms-data/variables/sex-beneficiary-0
          type: VARCHAR
          cast:
            '*': "{column_name}::VARCHAR"
          source:
            - sex # 1999, 2000, 2001, 2002, 2003, 2004, 2005, 2006, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018
            - bene_sex_ident_cd # 2007, 2008
      - race:
          reference: https://resdac.org/cms-data/variables/beneficiary-race-code-ffs
          type: VARCHAR
          cast:
            '*': "{column_name}::VARCHAR"
          source:
            - bene_race_cd # 2007, 2008
            - race # 1999, 2000, 2001, 2002, 2003, 2004, 2005, 2006, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018
      - dod_ndi: 
          description: This variable is the date of death as reported on the Beneficiary’s death certificate.
          reference: https://resdac.org/cms-data/variables/ndi-date-deathmbsf
          # optional: true
          source:  ndi_death_dt # 2011, 2012, 2013, 2014
          type: DATE
      - race_rti: 
          description: Research Triangle Institute (RTI) Race Code
          reference: https://resdac.org/cms-data/variables/research-triangle-institute-rti-race-code
          # optional: true
          source: rti_race_cd # 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018
      - hmo_indicators:
          type: CHAR(1)[12]
          optional: false
          description: Array of indicators if the beneficiary was enrolled in HMO during a given month
          reference: https://resdac.org/cms-data/variables/hmo-indicator
          source:

            - hmoind # 1999, 2000, 2001, 2002, 2009, 2010 (already in array format)
            - hmoind12 # only for years that are already in array format (2003, 2004, 2005, 2006)
            - hmoind{m} # 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018 (note hmoind12 needs to be used here to build the array. it is diff from hmoind12 from 2003-2006)
            - bene_hmo_ind_{m} # 2007, 2008
          # cast:
          #   'character varying': "[{columns}, NULL]"
      - hmo_cvg_count:
          type: INT
          optional: false
          description: Number of months during a given year, the beneficiary received their Part A and Part B benefits through a managed care plan
          reference: https://requests.resdac.org/cms-data/variables/hmo-coverage-count
          source:
            - hmo_mo # 2003, 2004, 2005, 2006, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018
            - hmocovg # 1999, 2000, 2001, 2002
            - bene_hmo_cvrage_tot_mons # 2007, 2008
          cast:
            '*': "CASE WHEN {column_name} IS NULL THEN NULL ELSE {column_name}::INT END"

      - buyin_indicators:
          # type: CHAR(1)[12]
          optional: true
          description: |
            Array of indicators if the beneficiary’s state of residence paid his/her monthly
            premium for Part B coverage (and Part A if necessary). State Medicaid programs
            can pay those premiums for certain dual eligibles; this action is called
            “buying in” and so this variable is the “buy-in code.”
          reference: https://resdac.org/cms-data/variables/medicare-entitlementbuy-indicator
          m: ['01', '02', '03', '04', '05', '06', '07', '08', '09', '10', '11', '12']
          source:
            - medicare_buy_in # 2009, 2010
            - buyin{m} # 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018
            - buyin12 # 2003, 2004, 2005, 2006, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018 (array for 2003-2006)
            - bene_mdcr_entlmt_buyin_ind_{m} # 2007, 2008
          # cast:
          #   'character varying': string_to_array({column_name}, NULL)
      - buyin_cvg_count:
                  type: INT
                  optional: false
                  description: Number of months during a given year, during the year when the beneficiary premium was paid by the state. 
                  reference: https://resdac.org/cms-data/variables/state-buy-coverage-count
                  source:
                    - buyin_mo # 2003, 2004, 2005, 2006, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018
                    - buycovg # 1999, 2000, 2001, 2002
                    - state_buy_in_mo # 2009, 2010
                    - bene_state_buyin_tot_mons # 2007, 2008
                  cast:
                    '*': "CASE WHEN {column_name} IS NULL THEN NULL ELSE {column_name}::INT END"
      - orec:
          type: INT
         # optional: true
          description: The original entitlement reason code
          source:
            - orec # 2003, 2004, 2005, 2006, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018
            - orig_ent # 1999, 2000, 2001, 2002, 2009, 2010
            - bene_entlmt_rsn_orig # 2007, 2008
          cast:
            '*': "{column_name}::INT"
      - curec:
          type: INT
          optional: true
          source:
            - cur_ent # 1999, 2000, 2001, 2002, 2009, 2010
            - bene_entlmt_rsn_curr # 2007, 2008
          cast:
            '*': "{column_name}::INT"
  ip:
    description: inpatient admissions view. taking multiple inpatient admissions files (MedPar) into a single view, transforming columns to same type.
    path_pattern: 
      - "{basepath}/{year}/medpar*/part-*.parquet"
      - "{basepath}/{year}/mp*/part-*.parquet"
    columns:
      - bene_id:
          source: 
            - bene_id # 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018
            - intbid # 1999-2002
            - bid_5333_1 # 2003-2005
            - bid_5333_3 # 2006
          type: VARCHAR
          cast:
            '*': "TRY_CAST({column_name} AS VARCHAR)"
      - year:
          source: 
            - medpar_yr_num # 2011-2018
          type: INT
          cast:
            '*': "TRY_CAST({column_name} AS INT)"
      - state:
          source: 
            - bene_rsdnc_ssa_state_cd # 2007-2010
            - medpar_bene_rsdnc_ssa_state_cd # 1999-2002
            - state_cd # 2003, 2004, 2005, 2006, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018
          type: INT
          cast:
            '*': "TRY_CAST({column_name} AS INT)"
      - zip:
          source: 
            - bene_zip # 2003, 2004, 2005, 2006, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018
            - bene_mlg_cntct_zip_cd # 2007 - 2010
            - medpar_bene_mlg_cntct_zip_cd # 1999 - 2002
          type: INT
          cast:
            '*': "TRY_CAST({column_name} AS INT)"
      - admission_date:
          type: DATE
          source:
            - medpar_admsn_dt # 1999-2002
            - admsn_dt # 2007 - 2010
            - admsndt # 2003, 2004, 2005, 2006, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018
          cast:
            VARCHAR: >
              CASE 
                WHEN {column_name} ~ '^[0-9]{8}$' AND {column_name} NOT IN ('00000000') 
                THEN STRPTIME({column_name}, '%Y%m%d') 
                ELSE NULL 
              END
            DOUBLE: >
              CASE
                WHEN {column_name} IS NOT NULL
                    AND CAST({column_name} AS BIGINT) BETWEEN 1900001 AND 2099366
                THEN STRPTIME(CAST(CAST({column_name} AS BIGINT) AS VARCHAR), '%Y%j')
                ELSE NULL
              END
      - discharge_date:
          type: DATE
          source:
            - medpar_dschrg_dt # 1999-2002
            - dschrg_dt # 2007 - 2010
            - dschrgdt # 2003, 2004, 2005, 2006, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018
          cast:
            VARCHAR: >
              CASE 
                WHEN {column_name} ~ '^[0-9]{8}$' AND {column_name} NOT IN ('00000000') 
                THEN STRPTIME({column_name}, '%Y%m%d') 
                ELSE NULL 
              END
            DOUBLE: >
              CASE
                WHEN {column_name} IS NOT NULL
                    AND CAST({column_name} AS BIGINT) BETWEEN 1900001 AND 2099366
                THEN STRPTIME(CAST(CAST({column_name} AS BIGINT) AS VARCHAR), '%Y%j')
                ELSE NULL
              END
      - adm_day_of_week:
            type: INT
            source:
              - medpar_admsn_day_cd
              - admsn_day_cd
              - admsnday
            cast: 
              "*" : "CAST({column_name} AS INT)"
      - admsn_type_cd:
            type: CHAR(1)
            cast:
              "*": "CAST({column_name} AS VARCHAR)"
            source:
              - ip_admsn_type_cd
              - type_adm
              - medpar_ip_admsn_type_cd
      - src_admsn_cd:
            type: CHAR(1)
            source:
              - src_ip_admsn_cd
              - src_adms
              - medpar_src_ip_admsn_cd
            cast:
              "*": "CAST({column_name} AS VARCHAR)"
      - dschrg_dstntn_cd:
            type: CHAR(2)
            source:
              - dschrg_dstntn_cd
              - dstntncd
              - medpar_dschrg_dstntn_cd
            cast:
                numeric: "TRIM(CAST({column_name} AS VARCHAR))"
                '*': "TRY_CAST({column_name} AS VARCHAR)"
      - dschrgcd:
            type: CHAR(1)
            source:
              - dschrgcd
              - bene_dschrg_stus_cd
              - medpar_bene_dschrg_stus_cd
            cast:
                '*': "TRY_CAST({column_name} AS VARCHAR)"
      - diag[{m}=1:25]:
            type: VARCHAR
            source:
              - medpar_dgns_cd_{m}
              - dgns_cd0{m}
              - dgns_cd{m}
              - dgns_{m}_cd
              - dgnscd{m}
            cast:
              '*': "TRY_CAST({column_name} AS VARCHAR)"

    # Expenditure variables
      - los_day_cnt:
          reference: "https://resdac.org/cms-data/variables/days-beneficiarys-stay-hospitalsnf"
          description: The count in days of the total length of a beneficiary's stay in a hospital
          type: INT
          cast:
            '*': "TRY_CAST({column_name} AS INT)"
          source:
            - los_day_cnt
            - loscnt
            - medpar_los_day_cnt

      - drg_price_amt:
          reference: "https://resdac.org/cms-data/variables/drg-price-amount"
          description: The amount (called the 'DRG price' for purposes of MEDPAR analysis) that would have been paid if no deductibles, coinsurance, primary payers, or outliers were involved (rounded to whole dollars).
          type: NUMERIC
          cast:
            '*': "TRY_CAST({column_name} AS DOUBLE)"
          source:
            - drg_price_amt
            - drgprice
            - medpar_drg_price_amt

      - drg_outlier_pmt_amt:
          reference: "https://resdac.org/cms-data/variables/drg-outlier-approved-payment-amount"
          description: The amount of additional payment (rounded to whole dollars) approved due to an outlier situation over the DRG allowance for the stay.
          type: NUMERIC
          cast:
            '*': "TRY_CAST({column_name} AS DOUBLE)"
          source:
            - drg_outlier_pmt_amt
            - outlramt
            - medpar_drg_outlier_pmt_amt

      - pass_thru_amt:
          reference: "https://resdac.org/cms-data/variables/pass-thru-diem-amount-stay"
          description: The total of all claim pass through per diem amounts (rounded to whole dollars) for the stay.
          type: NUMERIC
          cast:
            '*': "TRY_CAST({column_name} AS DOUBLE)"
          source:
            - pass_thru_amt
            - passthru
            - medpar_pass_thru_amt

      - mdcr_pmt_amt:
          reference: "https://resdac.org/cms-data/variables/total-medicare-payment-amount"
          description: Amount of payment made from the Medicare trust fund for the services covered by the claim record. For hospital services, this amount does not include the claim pass-through per diem payments made by Medicare.
          type: NUMERIC
          cast:
            '*': "TRY_CAST({column_name} AS DOUBLE)"
          source:
            - mdcr_pmt_amt
            - pmt_amt
            - medpar_mdcr_pmt_amt

      - bene_blood_ddctbl_amt:
          reference: "https://resdac.org/cms-data/variables/beneficiarys-liability-blood-deductible-stay"
          description: The amount of money (rounded to whole dollars) identified as the beneficiary's liability for the blood deductible for the stay.
          type: NUMERIC
          cast:
            '*': "TRY_CAST({column_name} AS DOUBLE)"
          source:
            - bene_blood_ddctbl_amt
            - blddedam
            - medpar_bene_blood_ddctbl_amt

      - bene_prmry_pyr_amt:
          reference: "https://resdac.org/cms-data/variables/primary-payer-paid-amount"
          description: The amount of payment (rounded to whole dollars) made on behalf of the beneficiary by a primary payer other than Medicare, which has been applied to the covered Medicare charges for the stay.
          type: NUMERIC
          cast:
            '*': "TRY_CAST({column_name} AS DOUBLE)"
          source:
            - bene_prmry_pyr_amt
            - prpayamt
            - medpar_bene_prmry_pyr_amt

      - bene_ip_ddctbl_amt:
          reference: "https://resdac.org/cms-data/variables/beneficiarys-liability-deductible-stay"
          description: The amount of money (rounded to whole dollars) identified as the beneficiary's liability for the inpatient deductible for the stay.
          type: NUMERIC
          cast:
            '*': "TRY_CAST({column_name} AS DOUBLE)"
          source:
            - bene_ip_ddctbl_amt
            - ded_amt
            - medpar_bene_ip_ddctbl_amt

      - bene_pta_coinsrnc_amt:
          reference: "https://resdac.org/cms-data/variables/beneficiarys-liability-part-coinsurance-stay"
          description: The amount of money (rounded to whole dollars) identified as the beneficiary's liability for part A coinsurance for the stay.
          type: NUMERIC
          cast:
            '*': "TRY_CAST({column_name} AS DOUBLE)"
          source:
            - bene_pta_coinsrnc_amt
            - coin_amt
            - medpar_bene_pta_coinsrnc_amt
