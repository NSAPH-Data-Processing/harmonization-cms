  #     # - dual_indicators: # save for normalization
  #         # type: CHAR(1)[12]
  #         # optional: true
  #         # m: ['01', '02', '03', '04', '05', '06', '07', '08', '09', '10', '11', '12']
  #         # source:
  #         #   - DUAL_{m}
  #         # cast:
