table_name: partd_pde
description: "Part D Prescription Drug Event data."
path_pattern: "{basepath}/{year}/pde_file_*/part-*.parquet"
columns:
    - pde_id:
        source: PDE_ID
        type: VARCHAR
        description: "Encrypted PDE ID"
    - bene_id:
        source: BENE_ID
        type: VARCHAR
        description: "Encrypted CCW beneficiary identifier; unique across CMS datasets."
    - rx_service_date:
        source: SRVC_DT
        type: DATE
        description: "RX Service Date (DOS)"
    - year:
        source: SRVC_DT
        type: INT
        description: "Calendar year derived from RX service date."
        cast:
            "*": "EXTRACT(YEAR FROM TRY_CAST({column_name} AS DATE))"
    - paid_date:
        source: PD_DT
        type: DATE
        description: "Paid Date"
    - product_service_id:
        source: PRDSRVID
        type: VARCHAR
        description: "Product Service ID"
    - qty_dispensed_num:
        source: QTYDSPNS
        type: NUMERIC
        description: "Quantity Dispensed"
    - days_suply_num:
        source: DAYSSPLY
        type: NUMERIC
        description: "Days Supply"
    - fill_num:
        source: FILL_NUM
        type: NUMERIC
        description: "Fill Number"
    - drug_coverage_status:
        source: DRCVSTCD
        type: VARCHAR
        description: "Drug Coverage Status Code"
    - gdc_blw_oopt_amt:
        source: GDCBOOPT
        type: NUMERIC
        description: "Gross Drug Cost Below Out-of-Pocket Threshold (GDCB)"
    - gdc_abv_oopt_amt:
        source: GDCAOOPT
        type: NUMERIC
        description: "Gross Drug Cost Above Out-of-Pocket Threshold (GDCA)"
    - patnt_pay_amt:
        source: PTPAYAMT
        type: NUMERIC
        description: "Patient Pay Amount"
    - othr_troop_amt:
        source: OTHTROOP
        type: NUMERIC
        description: "Other TrOOP Amount"
    - lics_amt:
        source: LICS_AMT
        type: NUMERIC
        description: "Low Income Cost Sharing Subsidy Amount (LICS)"
    - plro_amt:
        source: PLRO_AMT
        type: NUMERIC
        description: "Patient Liability Reduction Due to Other Payer Amount (PLRO)"
    - cvrd_d_plan_pd_amt:
        source: CPP_AMT
        type: NUMERIC
        description: "Covered D Plan Paid Amount (CPP)"
    - ncvrd_plan_pd_amt:
        source: NPP_AMT
        type: NUMERIC
        description: "Non-Covered Plan Paid Amount (NPP)"
    - tot_rx_cst_amt:
        source: TOTALCST
        type: NUMERIC
        description: "Gross Drug Cost"
    - benefit_phase:
        source: BNFTPHAS
        type: VARCHAR
        description: "The benefit phase of the Part D Event"
    - rptd_gap_dscnt_num:
        source: GAPDSCNT
        type: NUMERIC
        description: "Gap Discount Amount reported by the Submitting Plan"
    - brnd_gnrc_cd:
        source: BRNDGNCD
        type: VARCHAR
        description: "Brand or Generic Code"