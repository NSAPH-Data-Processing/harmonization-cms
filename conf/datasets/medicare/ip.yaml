  # ---------- Expenditure variables ----------
  - los_day_cnt:
      reference: "https://resdac.org/cms-data/variables/days-beneficiarys-stay-hospitalsnf"
      description: "Count in days of total length of stay"
      type: INT
      source: [los_day_cnt, loscnt, medpar_los_day_cnt]
      cast:
        "*": "TRY_CAST({column_name} AS INT)"

  - drg_price_amt:
      reference: "https://resdac.org/cms-data/variables/drg-price-amount"
      description: "DRG price amount"
      type: DOUBLE
      source: [drg_price_amt, drgprice, medpar_drg_price_amt]
      cast:
        "*": "TRY_CAST({column_name} AS DOUBLE)"

  - drg_outlier_pmt_amt:
