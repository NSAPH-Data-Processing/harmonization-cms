table_name: ps
description: "Patient Summary view combining multiple MBSF files"

path_pattern:
  - "{basepath}/{year}/mbsf_ab*/part-*.parquet"
  - "{basepath}/{year}/dnm/part-*.parquet"
  - "{basepath}/{year}/dn100__1/part-*.parquet"
  - "{basepath}/{year}/denominator_file/part-*.parquet"
  - "{basepath}/{year}/den/part-*.parquet"

columns:
  - bene_id:
      source:
        - bene_id
        - intbid
        - bid_5333_1
        - bid_5333_3
        - bid_5333_5
      type: VARCHAR
      cast:
        "*": "{column_name}::VARCHAR"

  - year:
      source:
        - rfrnc_yr
        - enrolyr
        - enroll_yr
        - bene_enrollmt_ref_yr
      type: INT
      cast:
        "*": >
          CASE
            WHEN TRY_CAST({column_name} AS INT) < 20 THEN 2000 + TRY_CAST({column_name} AS INT)
            WHEN TRY_CAST({column_name} AS INT) >= 20 AND TRY_CAST({column_name} AS INT) < 100 THEN 1900 + TRY_CAST({column_name} AS INT)
            ELSE TRY_CAST({column_name} AS INT)
          END

  - zip:
      source:
        - bene_zip
        - bene_zip_cd
        - zip
        - zipcode
        - zip_cd
      type: INT
      cast:
        "*": "TRY_CAST({column_name} AS INT)"

  - state:
      source:
        - state_cd
        - state
        - state_code
        - ssa_state
      type: INT
      cast:
        "*": "TRY_CAST({column_name} AS INT)"

  - dob:
      type: DATE
      description: "Date of birth"
      source:
        - bene_dob
        - dob
        - bene_birth_dt
      cast:
        VARCHAR: "CASE WHEN {column_name} ~ '^[0-9]{{8}}$' AND {column_name} NOT IN ('00000000') THEN CAST(STRFTIME('%Y-%m-%d', STRPTIME({column_name}, '%Y%m%d')) AS DATE) ELSE NULL END"
        DOUBLE: "CASE WHEN {column_name} >= 19000000 THEN CAST(STRFTIME('%Y-%m-%d', STRPTIME(LPAD(CAST({column_name} AS VARCHAR), 8, '0'), '%Y%m%d')) AS DATE) ELSE NULL END"
        "*": "TRY_CAST({column_name} AS DATE)"

  - dod:
      type: DATE
      description: "Date of beneficiary death, if available"
      source:
        - death_dt
        - bef_dod
        - bene_dod
        - bene_death_dt
      cast:
        VARCHAR: "CASE WHEN {column_name} ~ '^[0-9]{{8}}$' AND {column_name} NOT IN ('00000000') THEN CAST(STRFTIME('%Y-%m-%d', STRPTIME({column_name}, '%Y%m%d')) AS DATE) ELSE NULL END"
        DOUBLE: "CASE WHEN {column_name} >= 19000000 THEN CAST(STRFTIME('%Y-%m-%d', STRPTIME(LPAD(CAST({column_name} AS VARCHAR), 8, '0'), '%Y%m%d')) AS DATE) ELSE NULL END"
        "*": "TRY_CAST({column_name} AS DATE)"

  - county:
      type: VARCHAR
      description: "CMS provided county code"
      source:
        - cnty_cd
        - bene_county_cd
        - ssa_county
      cast:
        "*": "{column_name}::VARCHAR"

  - sex:
      reference: "https://resdac.org/cms-data/variables/sex-beneficiary-0"
      type: VARCHAR
      source:
        - sex
        - bene_sex_ident_cd
      cast:
        "*": "{column_name}::VARCHAR"

  - race:
      reference: "https://resdac.org/cms-data/variables/beneficiary-race-code-ffs"
      type: VARCHAR
      source:
        - bene_race_cd
        - race
      cast:
        "*": "{column_name}::VARCHAR"

  - dod_ndi:
      type: DATE
      description: "Date of death as reported on death certificate (NDI)"
      reference: "https://resdac.org/cms-data/variables/ndi-date-deathmbsf"
      source: ndi_death_dt
      cast:
        "*": "TRY_CAST({column_name} AS DATE)"

  - race_rti:
      description: "Research Triangle Institute (RTI) Race Code"
      reference: "https://resdac.org/cms-data/variables/research-triangle-institute-rti-race-code"
      source: rti_race_cd
      cast:
        "*": "{column_name}"

  # ---------- Arrays (no `{m}`) ----------

  - hmo_indicators:
      kind: array
      type: "VARCHAR[]"
      optional: false
      description: "Array of indicators if the beneficiary was enrolled in HMO during a given month"
      reference: "https://resdac.org/cms-data/variables/hmo-indicator"

      source_array:
        - hmoind
        - hmoind12

      source_component_sets:
        - [hmoind01, hmoind02, hmoind03, hmoind04, hmoind05, hmoind06, hmoind07, hmoind08, hmoind09, hmoind10, hmoind11, hmoind12]
        - [bene_hmo_ind_01, bene_hmo_ind_02, bene_hmo_ind_03, bene_hmo_ind_04, bene_hmo_ind_05, bene_hmo_ind_06, bene_hmo_ind_07, bene_hmo_ind_08, bene_hmo_ind_09, bene_hmo_ind_10, bene_hmo_ind_11, bene_hmo_ind_12]

      element_cast: "CAST({column_name} AS VARCHAR)"

      cast:
        VARCHAR: "ARRAY(SELECT CAST(ch AS VARCHAR) FROM UNNEST(STRING_SPLIT({column_name}, '')) AS t(ch))"
        "*": "{column_name}"

  - hmo_cvg_count:
      type: INT
      optional: false
      description: "Number of months during the year the beneficiary received benefits through a managed care plan"
      reference: "https://requests.resdac.org/cms-data/variables/hmo-coverage-count"
      source:
        - hmo_mo
        - hmocovg
        - bene_hmo_cvrage_tot_mons
      cast:
        "*": "CASE WHEN {column_name} IS NULL THEN NULL ELSE TRY_CAST({column_name} AS INT) END"

  - buyin_indicators:
      kind: array
      type: "VARCHAR[]"
      optional: true
      description: >
        Array of monthly indicators if the beneficiary’s state paid the monthly premium
        for Part B (and Part A if necessary).
      reference: "https://resdac.org/cms-data/variables/medicare-entitlementbuy-indicator"

      source_array:
        - medicare_buy_in
        - buyin12

      source_component_sets:
        - [buyin01, buyin02, buyin03, buyin04, buyin05, buyin06, buyin07, buyin08, buyin09, buyin10, buyin11, buyin12]
        - [bene_mdcr_entlmt_buyin_ind_01, bene_mdcr_entlmt_buyin_ind_02, bene_mdcr_entlmt_buyin_ind_03, bene_mdcr_entlmt_buyin_ind_04, bene_mdcr_entlmt_buyin_ind_05, bene_mdcr_entlmt_buyin_ind_06, bene_mdcr_entlmt_buyin_ind_07, bene_mdcr_entlmt_buyin_ind_08, bene_mdcr_entlmt_buyin_ind_09, bene_mdcr_entlmt_buyin_ind_10, bene_mdcr_entlmt_buyin_ind_11, bene_mdcr_entlmt_buyin_ind_12]

      element_cast: "CAST({column_name} AS VARCHAR)"

      cast:
        VARCHAR: "ARRAY(SELECT CAST(ch AS VARCHAR) FROM UNNEST(STRING_SPLIT({column_name}, '')) AS t(ch))"
        "*": "{column_name}"
        
  - buyin_cvg_count:
      type: INT
      optional: false
      description: "Number of months during the year when the beneficiary premium was paid by the state."
      reference: "https://resdac.org/cms-data/variables/state-buy-coverage-count"
      source:
        - buyin_mo
        - buycovg
        - state_buy_in_mo
        - bene_state_buyin_tot_mons
      cast:
        "*": "CASE WHEN {column_name} IS NULL THEN NULL ELSE TRY_CAST({column_name} AS INT) END"

  - orec:
      type: INT
      description: "The original entitlement reason code"
      source:
        - orec
        - orig_ent
        - bene_entlmt_rsn_orig
      cast:
        "*": "TRY_CAST({column_name} AS INT)"

  - curec:
      type: INT
      optional: true
      source:
        - cur_ent
        - bene_entlmt_rsn_curr
      cast:
        "*": "TRY_CAST({column_name} AS INT)"
