table_name: mbsf_d
description: "Data from mbsf_d* Parquet files used to create beneficiary and enrollment tables."
path_pattern: "{basepath}/{year}/mbsf_*d*/part-*.parquet"

columns:
  - bene_id:
      source: bene_id
      type: VARCHAR
      cast:
        "*": "{column_name}::VARCHAR"

  - year:
      source: rfrnc_yr
      type: INT
      cast:
        "*": "TRY_CAST({column_name} AS INT)"

  - dual_mo:
      source: dual_mo
      type: INT
      cast:
        "*": "TRY_CAST({column_name} AS INT)"

  # Monthly dual indicators as an array (length 12).
  #
  # Notes:
  # - No `{m}` expansion; all month columns are listed explicitly.
  # - If your raw schema uses lowercase dual_01..dual_12 instead, swap names accordingly.
  # - Missing month columns become NULL elements in the array.
  - dual_indicators:
      kind: array
      type: "VARCHAR[]"
      description: "Monthly dual indicators (12 elements)"

      # If you later discover a packed/string/array field, list it here.
      source_array: []

      # Choose one schema based on what exists in the parquet file
      source_component_sets:
        - [DUAL_01, DUAL_02, DUAL_03, DUAL_04, DUAL_05, DUAL_06, DUAL_07, DUAL_08, DUAL_09, DUAL_10, DUAL_11, DUAL_12]
        - [dual_01, dual_02, dual_03, dual_04, dual_05, dual_06, dual_07, dual_08, dual_09, dual_10, dual_11, dual_12]
        - [dual01, dual02, dual03, dual04, dual05, dual06, dual07, dual08, dual09, dual10, dual11, dual12]

      element_cast: >
        CASE
          WHEN {column_name} ~ '^\d+$' THEN CAST({column_name} AS VARCHAR)
          ELSE NULL
        END

      cast:
        "*": "{column_name}"