table_name: ip
description: "Inpatient admissions view. Harmonizes MedPar inpatient admissions across years and source layouts."

path_pattern:
  - "{basepath}/{year}/medpar*/part-*.parquet"
  - "{basepath}/{year}/mp*/part-*.parquet"

columns:
  - bene_id:
      source:
        - bene_id
        - intbid
        - bid_5333_1
        - bid_5333_3
        - bid_5333_5
      type: VARCHAR
      cast:
        "*": "TRY_CAST({column_name} AS VARCHAR)"

  - year:
      source:
        - medpar_yr_num
      type: INT
      cast:
        "*": "TRY_CAST({column_name} AS INT)"

  - state:
      source:
        - bene_rsdnc_ssa_state_cd
        - medpar_bene_rsdnc_ssa_state_cd
        - state_cd
      type: INT
      cast:
        "*": "TRY_CAST({column_name} AS INT)"

  - zip:
      source:
        - bene_zip
        - bene_mlg_cntct_zip_cd
        - medpar_bene_mlg_cntct_zip_cd
      type: INT
      cast:
        "*": "TRY_CAST({column_name} AS INT)"

  - ss_ls_snf_cd:
      type: CHAR(1)
      description: "Indicator identifying whether the MedPAR stay is from a short-stay hospital, long-stay hospital, or skilled nursing facility (SNF). Derived from the third character of the provider number on the first claim included in the MedPAR stay."
      source:
        - medpar_ss_ls_snf_ind_cd
        - ss_ls_snf_ind_cd
        - sslssnf
      cast:
        "*": "CAST({column_name} AS VARCHAR)"

  - admission_date:
      type: DATE
      description: "Date of admission"
      source:
        - medpar_admsn_dt
        - admsn_dt
        - admsndt
      cast:
        VARCHAR: "CASE WHEN {column_name} ~ '^[0-9]{{8}}$' AND {column_name} NOT IN ('00000000') THEN CAST(STRFTIME('%Y-%m-%d', STRPTIME({column_name}, '%Y%m%d')) AS DATE) WHEN {column_name} ~ '^[0-9]{{7}}$' AND CAST(SUBSTR({column_name}, 5, 3) AS INTEGER) BETWEEN 1 AND 366 THEN CAST(STRFTIME('%Y-%m-%d', STRPTIME({column_name}, '%Y%j')) AS DATE) ELSE NULL END"
        DOUBLE: "CASE WHEN {column_name} IS NOT NULL AND CAST({column_name} AS INT) BETWEEN 1900001 AND 2099366 THEN CAST(STRFTIME('%Y-%m-%d', STRPTIME(CAST(CAST({column_name} AS INT) AS VARCHAR), '%Y%j')) AS DATE) ELSE NULL END"
        "*": "TRY_CAST({column_name} AS DATE)"

  - discharge_date:
      type: DATE
      source:
        - medpar_dschrg_dt
        - dschrg_dt
        - dschrgdt
      cast:
        VARCHAR: "CASE WHEN {column_name} ~ '^[0-9]{{8}}$' AND {column_name} NOT IN ('00000000') THEN CAST(STRFTIME('%Y-%m-%d', STRPTIME({column_name}, '%Y%m%d')) AS DATE) WHEN {column_name} ~ '^[0-9]{{7}}$' AND CAST(SUBSTR({column_name}, 5, 3) AS INTEGER) BETWEEN 1 AND 366 THEN CAST(STRFTIME('%Y-%m-%d', STRPTIME({column_name}, '%Y%j')) AS DATE) ELSE NULL END"
        DOUBLE: "CASE WHEN {column_name} IS NOT NULL AND CAST({column_name} AS INT) BETWEEN 1900001 AND 2099366 THEN CAST(STRFTIME('%Y-%m-%d', STRPTIME(CAST(CAST({column_name} AS INT) AS VARCHAR), '%Y%j')) AS DATE) ELSE NULL END"
        "*": "TRY_CAST({column_name} AS DATE)"

  # This block was accidentally nested under discharge_date in the original chunk.
  - admission_day_cd:
      type: INT
      source:
        - medpar_admsn_day_cd
        - admsn_day_cd
        - admsnday
      cast:
        "*": "TRY_CAST({column_name} AS INT)"

  - admsn_type_cd:
      type: CHAR(1)
      source:
        - ip_admsn_type_cd
        - type_adm
        - medpar_ip_admsn_type_cd
      cast:
        "*": "CAST({column_name} AS VARCHAR)"

  - src_admsn_cd:
      type: CHAR(1)
      source:
        - src_ip_admsn_cd
        - src_adms
        - medpar_src_ip_admsn_cd
      cast:
        "*": "CAST({column_name} AS VARCHAR)"

  - dschrg_dstntn_cd:
      type: CHAR(2)
      source:
        - dschrg_dstntn_cd
        - dstntncd
        - medpar_dschrg_dstntn_cd
      cast:
        numeric: "TRIM(CAST({column_name} AS VARCHAR))"
        "*": "TRY_CAST({column_name} AS VARCHAR)"

  - dschrgcd:
      type: CHAR(1)
      source:
        - dschrgcd
        - bene_dschrg_stus_cd
        - medpar_bene_dschrg_stus_cd
      cast:
        "*": "TRY_CAST({column_name} AS VARCHAR)"

  # ---------- Diagnosis codes (array of up to 25 diagnosis codes per record) ----------
  - diagnoses:
      kind: array
      type: "VARCHAR[]"
      optional: true
      drop_nulls: true
      description: >
          Array of diagnosis codes per record, using all available source columns.
          The number of diagnosis fields varies across datasets and years, so records may contain fewer than 25 codes.
      reference: "internal harmonization mapping"

      source_component_sets:
          - [DGNSCD1, DGNSCD2, DGNSCD3, DGNSCD4, DGNSCD5, DGNSCD6, DGNSCD7, DGNSCD8, DGNSCD9, DGNSCD10,
            DGNSCD11, DGNSCD12, DGNSCD13, DGNSCD14, DGNSCD15, DGNSCD16, DGNSCD17, DGNSCD18, DGNSCD19, DGNSCD20,
            DGNSCD21, DGNSCD22, DGNSCD23, DGNSCD24, DGNSCD25]
          - [medpar_dgns_cd_1, medpar_dgns_cd_2, medpar_dgns_cd_3, medpar_dgns_cd_4, medpar_dgns_cd_5,
            medpar_dgns_cd_6, medpar_dgns_cd_7, medpar_dgns_cd_8, medpar_dgns_cd_9, medpar_dgns_cd_10,
            medpar_dgns_cd_11, medpar_dgns_cd_12, medpar_dgns_cd_13, medpar_dgns_cd_14, medpar_dgns_cd_15,
            medpar_dgns_cd_16, medpar_dgns_cd_17, medpar_dgns_cd_18, medpar_dgns_cd_19, medpar_dgns_cd_20,
            medpar_dgns_cd_21, medpar_dgns_cd_22, medpar_dgns_cd_23, medpar_dgns_cd_24, medpar_dgns_cd_25]
          - [dgns_cd01, dgns_cd02, dgns_cd03, dgns_cd04, dgns_cd05, dgns_cd06, dgns_cd07, dgns_cd08, dgns_cd09, dgns_cd10,
            dgns_cd11, dgns_cd12, dgns_cd13, dgns_cd14, dgns_cd15, dgns_cd16, dgns_cd17, dgns_cd18, dgns_cd19, dgns_cd20,
            dgns_cd21, dgns_cd22, dgns_cd23, dgns_cd24, dgns_cd25]
          - [dgns_cd1, dgns_cd2, dgns_cd3, dgns_cd4, dgns_cd5, dgns_cd6, dgns_cd7, dgns_cd8, dgns_cd9, dgns_cd10,
            dgns_cd11, dgns_cd12, dgns_cd13, dgns_cd14, dgns_cd15, dgns_cd16, dgns_cd17, dgns_cd18, dgns_cd19, dgns_cd20,
            dgns_cd21, dgns_cd22, dgns_cd23, dgns_cd24, dgns_cd25]

      element_cast: >
        CASE
          WHEN TRIM(CAST({column_name} AS VARCHAR)) = '' THEN NULL
          ELSE TRIM(CAST({column_name} AS VARCHAR))
        END
        
      cast:
          "*": "{column_name}"
        
    # ---------- Expenditure variables ----------
  - los_day_cnt:
      reference: "https://resdac.org/cms-data/variables/days-beneficiarys-stay-hospitalsnf"
      description: "Count in days of total length of stay"
      type: INT
      source: [los_day_cnt, loscnt, medpar_los_day_cnt]
      cast:
        "*": "TRY_CAST({column_name} AS INT)"

  - drg_price_amt:
      reference: "https://resdac.org/cms-data/variables/drg-price-amount"
      description: "DRG price amount"
      type: DOUBLE
      source: [drg_price_amt, drgprice, medpar_drg_price_amt]
      cast:
        "*": "TRY_CAST({column_name} AS DOUBLE)"

  - drg_outlier_pmt_amt:
      reference: "https://resdac.org/cms-data/variables/drg-outlier-approved-payment-amount"
      description: "Outlier payment amount"
      type: DOUBLE
      source: [drg_outlier_pmt_amt, outlramt, medpar_drg_outlier_pmt_amt]
      cast:
        "*": "TRY_CAST({column_name} AS DOUBLE)"

  - pass_thru_amt:
      reference: "https://resdac.org/cms-data/variables/pass-thru-diem-amount-stay"
      description: "Pass-through per diem amounts total"
      type: DOUBLE
      source: [pass_thru_amt, passthru, medpar_pass_thru_amt]
      cast:
        "*": "TRY_CAST({column_name} AS DOUBLE)"

  - mdcr_pmt_amt:
      reference: "https://resdac.org/cms-data/variables/total-medicare-payment-amount"
      description: "Total Medicare payment amount"
      type: DOUBLE
      source: [mdcr_pmt_amt, pmt_amt, medpar_mdcr_pmt_amt]
      cast:
        "*": "TRY_CAST({column_name} AS DOUBLE)"

  - bene_blood_ddctbl_amt:
      reference: "https://resdac.org/cms-data/variables/beneficiarys-liability-blood-deductible-stay"
      description: "Beneficiary liability for blood deductible"
      type: DOUBLE
      source: [bene_blood_ddctbl_amt, blddedam, medpar_bene_blood_ddctbl_amt]
      cast:
        "*": "TRY_CAST({column_name} AS DOUBLE)"

  - bene_prmry_pyr_amt:
      reference: "https://resdac.org/cms-data/variables/primary-payer-paid-amount"
      description: "Primary payer paid amount"
      type: DOUBLE
      source: [bene_prmry_pyr_amt, prpayamt, medpar_bene_prmry_pyr_amt]
      cast:
        "*": "TRY_CAST({column_name} AS DOUBLE)"

  - bene_ip_ddctbl_amt:
      reference: "https://resdac.org/cms-data/variables/beneficiarys-liability-deductible-stay"
      description: "Beneficiary inpatient deductible amount"
      type: DOUBLE
      source: [bene_ip_ddctbl_amt, ded_amt, medpar_bene_ip_ddctbl_amt]
      cast:
        "*": "TRY_CAST({column_name} AS DOUBLE)"

  - bene_pta_coinsrnc_amt:
      reference: "https://resdac.org/cms-data/variables/beneficiarys-liability-part-coinsurance-stay"
      description: "Beneficiary Part A coinsurance amount"
      type: DOUBLE
      source: [bene_pta_coinsrnc_amt, coin_amt, medpar_bene_pta_coinsrnc_amt]
      cast:
        "*": "TRY_CAST({column_name} AS DOUBLE)"

    # ---------- bene_id crosswalk (2000-2006) ----------

crosswalks:
  - name: bene_xwalk
    min_year: 2000
    max_year: 2006
    path: "{crosswalks_path}/bene_xwalk.parquet"
    format: parquet
    join:
      how: left
      "on":
        bene_id: bid
    select:
      exclude_base:
        - bene_id
      coalesce:
        bene_id:
          - cw_bene_xwalk.bene_id
          - base.bene_id
