      cast:
        "*": "TRY_CAST({column_name} AS VARCHAR)"

  - ptd_cntrct_id_04:
      type: VARCHAR
      description: "Part D contract ID for April"
      source:
        - PTDCNTRCT04
      cast:
        "*": "TRY_CAST({column_name} AS VARCHAR)"

  - ptd_cntrct_id_05:
      type: VARCHAR
      description: "Part D contract ID for May"
      source:
        - PTDCNTRCT05
      cast:
        "*": "TRY_CAST({column_name} AS VARCHAR)"

  - ptd_cntrct_id_06:
      type: VARCHAR
      description: "Part D contract ID for June"
      source:
        - PTDCNTRCT06
      cast:
        "*": "TRY_CAST({column_name} AS VARCHAR)"

  - ptd_cntrct_id_07:
