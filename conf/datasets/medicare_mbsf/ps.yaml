pre_join:
  - name: mbsf_d
    path: "{basepath}/{year}/mbsf_d*/part-*.parquet"
    min_year: 2011
    max_year: 2014
    how: left
    "on":
      BENE_ID: BENE_ID     
      RFRNC_YR: RFRNC_YR
    columns:
      - DUAL_MO
      - DUAL_01
      - DUAL_02
      - DUAL_03
      - DUAL_04
      - DUAL_05
      - DUAL_06
      - DUAL_07
      - DUAL_08
      - DUAL_09
      - DUAL_10
      - DUAL_11
      - DUAL_12

## implement bene_id crosswalk for datasets from year 2000-2006 

crosswalks:
  - name: bene_xwalk
    path: "{crosswalks_path}/bene_xwalk.parquet"
    min_year: 2000
    max_year: 2006
    format: parquet
    join:
      how: left
      "on":
        bene_id: bid
    select:
      exclude_base:
        - bene_id
      coalesce:
        bene_id:
          - cw_bene_xwalk.bene_id
          - base.bene_id