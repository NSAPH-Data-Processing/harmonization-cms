  - chip_type_mo_01:
      kind: scalar
      type: "VARCHAR"
      description: >-
        Monthly harmonized CHIP type, numeric code preserved as-is (not translated to a
        descriptive label). 12 elements, January to December.

        Codebook:
          0 = not_eligible
          1 = not_chip
          2 = medicaid_or_medicaid_expansion_chip
          3 = separate_chip
          4 = medicaid_and_separate_chip (TAF only, no MAX equivalent)
          9 = unknown CHIP status (MAX only, no MAX-9-equivalent code on
            the TAF side)
          NULL = missing source value / unrecognized value

        Month-specific scalar version of `chip_type` for January (month 01).
      month: 1
      source:
        - EL_CHIP_FLAG_1
        - CHIP_CD_01
        - SCHIP1
      cast:
        "*": >
          CASE
            WHEN NULLIF(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), '') IS NULL THEN NULL

            WHEN TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)) IN ('0', '1', '2', '3') THEN TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1))

            WHEN source_type = 'max' AND TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)) = '9' THEN '9'
            WHEN source_type = 'taf' AND TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)) = '4' THEN '4'

            ELSE NULL
          END
