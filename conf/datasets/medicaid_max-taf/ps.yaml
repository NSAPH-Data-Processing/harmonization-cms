table_name: ps
description: Harmonization rules for Medicaid MAX-TAF patient summary (ps) files

path_pattern:
  - "{basepath}/{year}/taf_demog_elig_base_*/part-*.parquet"
  - "{basepath}/{year}/maxdata_*_ps/part-*.parquet"

columns:  # IN lists of 5+ constants are written as list_contains([...], x), shorter lists stay IN: duckdb plans an IN with 5+ constants as a hash join (PS-D32, PS-D33)
  - bene_id:
      source:
        - BENE_ID
      type: VARCHAR
      cast:
        "*": "TRY_CAST({column_name} AS VARCHAR)"

  - msis_id:
      description: >
        State-assigned MSIS identification number MAX's MSIS_ID is a raw, unencrypted state-assigned
        identifier. TAF's MSIS_ID is a 32-character encrypted hash of the
        same underlying concept, MAX-side and TAF-side values are not directly
        comparable/joinable to each other -- use bene_id for person-level linkage across MAX and
        TAF years, not msis_id.
      source:
        - MSIS_ID
      type: VARCHAR
      cast:
        "*": "TRY_CAST({column_name} AS VARCHAR)"
  - year:
      source:
        - source_filename
      type: INTEGER
      cast:
        "*": "TRY_CAST(regexp_extract({column_name}, '/([0-9]{{4}})/', 1) AS INTEGER)"
  - raw_filename:
      source:
        - source_filename
      type: VARCHAR
      cast:
        "*": "TRY_CAST({column_name} AS VARCHAR)"
  - source_type:
      source:
        - source_filename
      type: VARCHAR
      cast:
        "*": |
          CASE
            WHEN lower({column_name}) LIKE '%maxdata_%' THEN 'max'
            WHEN lower({column_name}) LIKE '%taf_%' THEN 'taf'
            ELSE NULL
          END
  - state:
      description: >
        State whose Medicaid/CHIP program submitted the data, as a 2-character
        USPS postal abbreviation. This is the submitting (paying) state, not
        necessarily the state of residence; for residence geography use
        county and zip. Not the same concept as Medicare's `state`, which is
        the state of residence from the SSA mailing address.
      source:
        - STATE_CD
        - STATE
      type: VARCHAR
      cast:
        "*": "TRY_CAST({column_name} AS VARCHAR)"

  - state_case_num:
      description: >
        State-assigned Medicaid case number (a case can cover multiple
        people, e.g. a family, each with their own msis_id but a shared
        case number).
        MAX's EL_STATE_CASE_NUM is a raw, unencrypted state-assigned number, while 
        TAF's MSIS_CASE_NUM is a 32-character encrypted hash of the same underlying concept. 
        Not directly comparable/joinable across MAX and TAF.
      source:
        - EL_STATE_CASE_NUM
        - MSIS_CASE_NUM
      type: VARCHAR
      cast:
        "*": "TRY_CAST({column_name} AS VARCHAR)"

  - dob:
      source:
        - EL_DOB
        - BIRTH_DT
      type: DATE
      cast:
        "*": "TRY_CAST({column_name} AS DATE)"

  - sex:
      description: >
        Recoded from MAX/TAF's letter codes to align with Medicare's MBSF SEX_IDENT_CD 
        numeric convention for cross-dataset consistency with the medicare
        Codebook:
          0 = unknown
          1 = male
          2 = female
          NULL = missing source value / unrecognized value
      source:
        - EL_SEX_CD
        - SEX_CD
        - SEX
      type: VARCHAR
      cast:
        "*": >
          CASE
            WHEN NULLIF(TRIM(CAST({column_name} AS VARCHAR)), '') IS NULL THEN NULL

            WHEN UPPER(TRIM(CAST({column_name} AS VARCHAR))) = 'M' THEN '1'
            WHEN UPPER(TRIM(CAST({column_name} AS VARCHAR))) = 'F' THEN '2'
            WHEN UPPER(TRIM(CAST({column_name} AS VARCHAR))) = 'U' THEN '0'

            ELSE NULL
          END

  - race:
      description: >
        Harmonized race codes. Codes 0-6 are numbered to align
        exactly with Medicare race convention (the CCW/ResDAC-
        recommended research race variable) for cross-dataset consistency
        Codes 7-8 are MAX/TAF-only extensions beyond Medicare's 0-6 range, 
        capturing distinctions
        (Native Hawaiian/Pacific Islander split from Asian; multiracial)
        that Medicare's race variable does not make.

        Codebook:
          0 = unknown
          1 = white_non_hispanic
          2 = black_non_hispanic
          3 = other_non_hispanic_or_unknown_ethnicity
          4 = asian_non_hispanic
          5 = hispanic_any_race
          6 = american_indian_alaska_native
          7 = native_hawaiian_pacific_islander
          8 = multiracial_non_hispanic_or_unknown_ethnicity
          NULL = missing source value / unrecognized value
      source:
        - EL_RACE_ETHNCY_CD
        - RACE_ETHNCTY_CD
        - RACE
      type: VARCHAR
      cast:
        "*": >
          CASE
            WHEN NULLIF(TRIM(CAST({column_name} AS VARCHAR)), '') IS NULL THEN NULL

            WHEN source_type = 'max' AND TRY_CAST({column_name} AS INTEGER) = 1 THEN '1'
            WHEN source_type = 'max' AND TRY_CAST({column_name} AS INTEGER) = 2 THEN '2'
            WHEN source_type = 'max' AND TRY_CAST({column_name} AS INTEGER) = 3 THEN '6'
            WHEN source_type = 'max' AND TRY_CAST({column_name} AS INTEGER) = 4 THEN '4'
            WHEN source_type = 'max' AND TRY_CAST({column_name} AS INTEGER) IN (5, 7) THEN '5'
            WHEN source_type = 'max' AND TRY_CAST({column_name} AS INTEGER) = 6 THEN '7'
            WHEN source_type = 'max' AND TRY_CAST({column_name} AS INTEGER) = 8 THEN '8'
            WHEN source_type = 'max' AND TRY_CAST({column_name} AS INTEGER) = 9 THEN '0'

            WHEN source_type = 'taf' AND TRY_CAST({column_name} AS INTEGER) = 1 THEN '1'
            WHEN source_type = 'taf' AND TRY_CAST({column_name} AS INTEGER) = 2 THEN '2'
            WHEN source_type = 'taf' AND TRY_CAST({column_name} AS INTEGER) = 4 THEN '6'
            WHEN source_type = 'taf' AND TRY_CAST({column_name} AS INTEGER) = 3 THEN '4'
            WHEN source_type = 'taf' AND TRY_CAST({column_name} AS INTEGER) = 7 THEN '5'
            WHEN source_type = 'taf' AND TRY_CAST({column_name} AS INTEGER) = 5 THEN '7'
            WHEN source_type = 'taf' AND TRY_CAST({column_name} AS INTEGER) = 6 THEN '8'
            WHEN source_type = 'taf' AND TRY_CAST({column_name} AS INTEGER) = 8 THEN '3'

            ELSE NULL
          END

  - ethnicity:
      description: >
        Data team harmonized ethnicity codes.

        Codebook:
          0 = non_hispanic_or_latino
          1 = mexican_mexican_american_chicano
          2 = puerto_rican
          3 = cuban
          4 = another_hispanic_latino_or_spanish_origin
          5 = hispanic_or_latino_subcategory_unknown
          9 = ethnicity_unknown
          NULL = missing source value / unrecognized value
      source:
        - ETHNICITY_CODE
        - ETHNCTY_CD
      type: VARCHAR
      cast:
        "*": >
          CASE
            WHEN NULLIF(TRIM(CAST({column_name} AS VARCHAR)), '') IS NULL THEN NULL

            WHEN source_type = 'max' AND TRY_CAST({column_name} AS INTEGER) = 0 THEN '0'
            WHEN source_type = 'max' AND TRY_CAST({column_name} AS INTEGER) = 1 THEN '5'
            WHEN source_type = 'max' AND TRY_CAST({column_name} AS INTEGER) = 9 THEN '9'

            WHEN source_type = 'taf' AND TRY_CAST({column_name} AS INTEGER) = 0 THEN '0'
            WHEN source_type = 'taf' AND TRY_CAST({column_name} AS INTEGER) = 1 THEN '1'
            WHEN source_type = 'taf' AND TRY_CAST({column_name} AS INTEGER) = 2 THEN '2'
            WHEN source_type = 'taf' AND TRY_CAST({column_name} AS INTEGER) = 3 THEN '3'
            WHEN source_type = 'taf' AND TRY_CAST({column_name} AS INTEGER) = 4 THEN '4'
            WHEN source_type = 'taf' AND TRY_CAST({column_name} AS INTEGER) = 5 THEN '5'

            ELSE NULL
          END

  - dod:
      source:
        - EL_DOD
        - DEATH_DT
      type: DATE
      cast:
        "*": "TRY_CAST({column_name} AS DATE)"

  - county:
      description: >
        Both MAX (EL_RSDNC_CNTY_CD_LTST) and TAF (BENE_CNTY_CD)
        source columns are documented FIPS county codes.
      source:
        - EL_RSDNC_CNTY_CD_LTST
        - BENE_CNTY_CD
        - FIPSCNTY
      type: VARCHAR
      cast:
        "*": >
          CASE
            WHEN NULLIF(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), '') IS NULL THEN NULL
            WHEN source_type = 'max' AND LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 3, '0') IN ('000', '999') THEN NULL
            ELSE LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 3, '0')
          END

  - zip:
      description: >
        Residence 5-digit ZIP code (most recent in year).
      source:
        - EL_RSDNC_ZIP_CD_LTST
        - BENE_ZIP_CD
        - ZIP
      type: VARCHAR
      cast:
        "*": >
          CASE
            WHEN NULLIF(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), '') IS NULL THEN NULL

            WHEN source_type = 'max' AND LENGTH(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1))) > 9 THEN NULL
            WHEN source_type = 'max' AND LENGTH(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1))) > 5
              AND LEFT(LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 9, '0'), 5) IN ('00000', '99999') THEN NULL
            WHEN source_type = 'max' AND LENGTH(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1))) > 5
              THEN LEFT(LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 9, '0'), 5)
            WHEN source_type = 'max' AND LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 5, '0') IN ('00000', '99999') THEN NULL
            WHEN source_type = 'max' THEN LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 5, '0')

            ELSE LEFT(LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 5, '0'), 5)
          END

  - missing_eligibility_data:
      description: >
        Data team harmonized missing eligibility data indicator, styled to align
        with TAF.

        Codebook:
          0 = not missing eligibility information (MAX blank; MAX 2 = S-CHIP-only enrollee: some
            month with chip_type_mo_* = 3 and no month with chip_type_mo_* 1, 2 or 4; TAF 0)
          1 = yes_missing_eligibility_information (MAX 1; TAF 1)
          NULL = missing source value (TAF blank, or no source variable) / unrecognized value (MAX:
            other than blank, exactly 1 or 2; TAF: other than exactly 0 or 1; not rounded)
      source:
        - MSNG_ELG_DATA
        - MISG_ELGBLTY_DATA_IND
        - MISSELIG
      type: VARCHAR
      cast:
        "*": >
          CASE
            WHEN source_type = 'max'
              AND NULLIF(TRIM(CAST({column_name} AS VARCHAR)), '') IS NULL
              THEN '0'
            WHEN source_type = 'max'
              AND TRY_CAST({column_name} AS DOUBLE) = 2
              THEN '0'
            WHEN source_type = 'max'
              AND TRY_CAST({column_name} AS DOUBLE) = 1
              THEN '1'

            WHEN source_type = 'taf'
              AND TRY_CAST({column_name} AS DOUBLE) = 0
              THEN '0'
            WHEN source_type = 'taf'
              AND TRY_CAST({column_name} AS DOUBLE) = 1
              THEN '1'

            ELSE NULL
          END

  - dual_code:
      description: >
        Annual (most-recent) Medicare dual eligibility code. Same coding
        scheme and mapping logic as the monthly dual_eligibility_mo_*
        variables, applied to the annual "most recent in year" source
        columns instead of a specific month.

        Codebook:
          00 = eligible_is_not_a_medicare_beneficiary
          01 = qmb_only
          02 = qmb_and_medicaid_coverage
          03 = slmb_only
          04 = slmb_and_medicaid_coverage
          05 = qdwi
          06 = qualifying_individual
          08 = other_dual_eligible
          09 = medicare_entitled_without_medicaid_coverage (TAF only; same meaning as MBSF 09)
          10 = separate_chip_eligible_entitled_to_medicare
          11 = dual_category_unknown (MAX only -- MAX 09/59; recoded from 09 so that 09
            keeps one meaning, TAF's/MBSF's)
          99 = unknown (MAX only -- Medicare status unknown per MSIS, or an
            EDB record found with no matching MSIS category or with MSIS
            status unknown (MAX 98); matches CCW
            MBSF's own DUAL_STUS_CD convention, where 99 = Unknown)
          NULL = missing source value / unrecognized value
      source:
        - EL_MDCR_DUAL_ANN
        - EL_MDCR_ANN_XOVR_99
        - DUAL_ELGBL_CD_LTST
        - XOVER_N
      type: "VARCHAR"
      cast:
        "*": >
          CASE
            WHEN NULLIF(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), '') IS NULL THEN NULL

            WHEN list_contains(['00', '01', '02', '03', '04', '05', '06', '08', '10'],
              LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0'))
              THEN LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0')

            WHEN source_type = 'taf' AND LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0') = '09' THEN '09'
            WHEN source_type = 'max' AND LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0') = '09' THEN '11'

            WHEN source_type = 'max' AND LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0') = '07' THEN '06'
            WHEN source_type = 'max' AND LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0') IN ('50', '98', '99') THEN '99'
            WHEN source_type = 'max' AND LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0') = '51' THEN '01'
            WHEN source_type = 'max' AND LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0') = '52' THEN '02'
            WHEN source_type = 'max' AND LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0') = '53' THEN '03'
            WHEN source_type = 'max' AND LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0') = '54' THEN '04'
            WHEN source_type = 'max' AND LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0') = '55' THEN '05'
            WHEN source_type = 'max' AND LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0') IN ('56', '57') THEN '06'
            WHEN source_type = 'max' AND LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0') = '58' THEN '08'
            WHEN source_type = 'max' AND LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0') = '59' THEN '11'
            WHEN source_type = 'max' AND LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0') = '60' THEN '10'

            ELSE NULL
          END

  - dual:
      description: >
        Annual dual eligibility indicator (Medicare-style 0/1), derived from
        the same annual source as dual_code.

        Codebook:
          1 = dual eligible (dual_code 01-06, 08, 11 = MAX dual, category unknown)
          0 = not dual (dual_code 00; 10 = separate CHIP + Medicare, not Medicaid;
            09 = TAF entitled to Medicare but without Medicaid coverage)
          NULL = dual status unknown (dual_code 99) / missing source value / unrecognized value
      source:
        - EL_MDCR_DUAL_ANN
        - EL_MDCR_ANN_XOVR_99
        - DUAL_ELGBL_CD_LTST
        - XOVER_N
      type: INTEGER
      cast:
        "*": >
          CASE
            WHEN NULLIF(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), '') IS NULL THEN NULL

            WHEN LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0') = '00' THEN 0
            WHEN list_contains(['01', '02', '03', '04', '05', '06', '08'], LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0')) THEN 1
            WHEN source_type = 'max' AND LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0') = '09' THEN 1
            WHEN source_type = 'taf' AND LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0') = '09' THEN 0
            WHEN LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0') = '10' THEN 0

            WHEN source_type = 'max' AND list_contains(['07', '51', '52', '53', '54', '55', '56', '57', '58', '59'], LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0')) THEN 1
            WHEN source_type = 'max' AND LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0') = '60' THEN 0

            ELSE NULL
          END

  - dual_eligibility_mo_01:
      kind: scalar
      type: "VARCHAR"
      description: >-
        Monthly Medicare dual eligibility code. 12 elements, January to December. Harmonized to
        align with TAF-style dual eligibility codes.

        Codebook:
          00 = eligible_is_not_a_medicare_beneficiary
          01 = qmb_only
          02 = qmb_and_medicaid_coverage
          03 = slmb_only
          04 = slmb_and_medicaid_coverage
          05 = qdwi
          06 = qualifying_individual
          08 = other_dual_eligible
          09 = medicare_entitled_without_medicaid_coverage (TAF only; same meaning as MBSF 09)
          10 = separate_chip_eligible_entitled_to_medicare
          11 = dual_category_unknown (MAX only -- MAX 09/59; recoded from 09 so that 09
            keeps one meaning, TAF's/MBSF's)
          99 = unknown (MAX only -- Medicare status unknown per MSIS, or an
            EDB record found with no matching MSIS category or with MSIS
            status unknown (MAX 98); matches CCW
            MBSF's own DUAL_STUS_CD convention, where 99 = Unknown)
          NULL = missing source value / unrecognized value

        Codes 00-09 and 99 match CCW MBSF's DUAL_STUS_CD numbering and meaning exactly (see
        docs/sources/mbsf_codebook.txt); 10 is a Medicaid/TAF-only extension (CHIP + Medicare)
        that MBSF has no equivalent for, since Medicare has no CHIP concept; 11 is a MAX-only
        extension (dual, category unknown).

        Month-specific scalar version of `dual_eligibility` for January (month 01).
      month: 1
      source:
        - EL_MDCR_DUAL_MO_1
        - EL_MDCR_XOVR_MO_1
        - DUAL_ELGBL_CD_01
      cast:
        "*": >
          CASE
            WHEN NULLIF(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), '') IS NULL THEN NULL

            WHEN list_contains(['00', '01', '02', '03', '04', '05', '06', '08', '10'],
              LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0'))
              THEN LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0')

            WHEN source_type = 'taf' AND LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0') = '09' THEN '09'
            WHEN source_type = 'max' AND LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0') = '09' THEN '11'

            WHEN source_type = 'max' AND LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0') = '07' THEN '06'
            WHEN source_type = 'max' AND LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0') IN ('50', '98', '99') THEN '99'
            WHEN source_type = 'max' AND LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0') = '51' THEN '01'
            WHEN source_type = 'max' AND LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0') = '52' THEN '02'
            WHEN source_type = 'max' AND LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0') = '53' THEN '03'
            WHEN source_type = 'max' AND LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0') = '54' THEN '04'
            WHEN source_type = 'max' AND LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0') = '55' THEN '05'
            WHEN source_type = 'max' AND LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0') IN ('56', '57') THEN '06'
            WHEN source_type = 'max' AND LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0') = '58' THEN '08'
            WHEN source_type = 'max' AND LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0') = '59' THEN '11'
            WHEN source_type = 'max' AND LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0') = '60' THEN '10'

            ELSE NULL
          END
  - dual_eligibility_mo_02:
      kind: scalar
      type: "VARCHAR"
      description: >-
        Monthly Medicare dual eligibility code. 12 elements, January to December. Harmonized to
        align with TAF-style dual eligibility codes.

        Codebook:
          00 = eligible_is_not_a_medicare_beneficiary
          01 = qmb_only
          02 = qmb_and_medicaid_coverage
          03 = slmb_only
          04 = slmb_and_medicaid_coverage
          05 = qdwi
          06 = qualifying_individual
          08 = other_dual_eligible
          09 = medicare_entitled_without_medicaid_coverage (TAF only; same meaning as MBSF 09)
          10 = separate_chip_eligible_entitled_to_medicare
          11 = dual_category_unknown (MAX only -- MAX 09/59; recoded from 09 so that 09
            keeps one meaning, TAF's/MBSF's)
          99 = unknown (MAX only -- Medicare status unknown per MSIS, or an
            EDB record found with no matching MSIS category or with MSIS
            status unknown (MAX 98); matches CCW
            MBSF's own DUAL_STUS_CD convention, where 99 = Unknown)
          NULL = missing source value / unrecognized value

        Codes 00-09 and 99 match CCW MBSF's DUAL_STUS_CD numbering and meaning exactly (see
        docs/sources/mbsf_codebook.txt); 10 is a Medicaid/TAF-only extension (CHIP + Medicare)
        that MBSF has no equivalent for, since Medicare has no CHIP concept; 11 is a MAX-only
        extension (dual, category unknown).

        Month-specific scalar version of `dual_eligibility` for February (month 02).
      month: 2
      source:
        - EL_MDCR_DUAL_MO_2
        - EL_MDCR_XOVR_MO_2
        - DUAL_ELGBL_CD_02
      cast:
        "*": >
          CASE
            WHEN NULLIF(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), '') IS NULL THEN NULL

            WHEN list_contains(['00', '01', '02', '03', '04', '05', '06', '08', '10'],
              LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0'))
              THEN LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0')

            WHEN source_type = 'taf' AND LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0') = '09' THEN '09'
            WHEN source_type = 'max' AND LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0') = '09' THEN '11'

            WHEN source_type = 'max' AND LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0') = '07' THEN '06'
            WHEN source_type = 'max' AND LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0') IN ('50', '98', '99') THEN '99'
            WHEN source_type = 'max' AND LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0') = '51' THEN '01'
            WHEN source_type = 'max' AND LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0') = '52' THEN '02'
            WHEN source_type = 'max' AND LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0') = '53' THEN '03'
