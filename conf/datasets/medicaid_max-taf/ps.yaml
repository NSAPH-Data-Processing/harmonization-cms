  - mc_plan_type_mo_01:
      kind: scalar
      type: "VARCHAR"
      description: >-
        Monthly harmonized managed care plan type: the highest-priority plan
        type the beneficiary was enrolled in that month, using TAF's
        MC_PLAN_TYPE_CD hierarchy (comprehensive first, PCCM and care
        coordination last), applied to MAX's plan-combination codes.

        Codebook:
          comprehensive = comprehensive MCO or HIO (incl. any MAX combination with a comprehensive plan)
          other_managed_care = medical-only PIHP/PAHP, LTC/LTSS PIHP, PACE, transportation, pharmacy, disease management, or other plan
          dental = dental plan (no higher-priority plan)
          behavioral_health = mental health and/or SUD plan (no higher-priority plan)
          pccm = primary care case management only
          aco = accountable care organization only (TAF only)
          health_home = health/medical home only (TAF only)
          integrated_care_for_duals = integrated care for dual eligibles only (TAF only)
          other_combination = MAX "other combinations" (15), plan mix not identified (MAX only)
          ffs = fee-for-service, no managed care plan reported (MAX 16; TAF blank or 00)
          not_eligible = not eligible for Medicaid this month (MAX only)
          unknown = managed care status unknown (MAX only)
          NULL = missing source value / unrecognized value

        Month-specific scalar managed care plan type for January (month 01).
      month: 1
      source:
        - MC_COMBO_MO_1
        - MC_PLAN_TYPE_CD_01
        - MCCOMB01
      cast:
        "*": >
          CASE
            WHEN source_type = 'max' AND NULLIF(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), '') IS NULL THEN NULL
            WHEN source_type = 'taf' AND NULLIF(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), '') IS NULL THEN 'ffs'

            WHEN source_type = 'max' AND LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0') = '00' THEN 'not_eligible'
            WHEN source_type = 'max' AND list_contains(['01', '06', '07', '08', '09'], LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0')) THEN 'comprehensive'
            WHEN source_type = 'max' AND LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0') IN ('05', '12') THEN 'other_managed_care'
            WHEN source_type = 'max' AND LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0') IN ('02', '10', '13', '14') THEN 'dental'
            WHEN source_type = 'max' AND LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0') IN ('03', '11') THEN 'behavioral_health'
            WHEN source_type = 'max' AND LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0') = '04' THEN 'pccm'
            WHEN source_type = 'max' AND LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0') = '15' THEN 'other_combination'
            WHEN source_type = 'max' AND LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0') = '16' THEN 'ffs'
            WHEN source_type = 'max' AND LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0') = '99' THEN 'unknown'

            WHEN source_type = 'taf' AND LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0') = '00' THEN 'ffs'
            WHEN source_type = 'taf' AND LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0') IN ('01', '04') THEN 'comprehensive'
            WHEN source_type = 'taf' AND list_contains(['05', '06', '07', '15', '16', '17', '18', '20'], LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0')) THEN 'other_managed_care'
            WHEN source_type = 'taf' AND LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0') = '14' THEN 'dental'
            WHEN source_type = 'taf' AND list_contains(['08', '09', '10', '11', '12', '13', '19'], LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0')) THEN 'behavioral_health'
            WHEN source_type = 'taf' AND LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0') IN ('02', '03') THEN 'pccm'
            WHEN source_type = 'taf' AND LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0') = '60' THEN 'aco'
            WHEN source_type = 'taf' AND LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0') = '70' THEN 'health_home'
            WHEN source_type = 'taf' AND LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0') = '80' THEN 'integrated_care_for_duals'

            ELSE NULL
          END
