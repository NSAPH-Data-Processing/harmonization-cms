          CASE
            WHEN NULLIF(TRIM(CAST({column_name} AS VARCHAR)), '') IS NULL THEN NULL
            WHEN LPAD(TRIM(CAST({column_name} AS VARCHAR)), 2, '0') = '99' THEN NULL

            WHEN LPAD(TRIM(CAST({column_name} AS VARCHAR)), 2, '0') = '00' THEN 'not_eligible'

