            WHEN source_type = 'max' AND LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0') = '15' THEN 'other_combination'
            WHEN source_type = 'max' AND LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0') = '16' THEN 'ffs'
            WHEN source_type = 'max' AND LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0') = '99' THEN 'unknown'

            WHEN source_type = 'taf' AND LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0') = '00' THEN 'ffs'
            WHEN source_type = 'taf' AND LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0') IN ('01', '04') THEN 'comprehensive'
            WHEN source_type = 'taf' AND list_contains(['05', '06', '07', '15', '16', '17', '18', '20'], LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0')) THEN 'other_managed_care'
            WHEN source_type = 'taf' AND LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0') = '14' THEN 'dental'
            WHEN source_type = 'taf' AND list_contains(['08', '09', '10', '11', '12', '13', '19'], LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0')) THEN 'behavioral_health'
            WHEN source_type = 'taf' AND LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0') IN ('02', '03') THEN 'pccm'
            WHEN source_type = 'taf' AND LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0') = '60' THEN 'aco'
            WHEN source_type = 'taf' AND LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0') = '70' THEN 'health_home'
            WHEN source_type = 'taf' AND LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0') = '80' THEN 'integrated_care_for_duals'

            ELSE NULL
          END
  - eligibility_month_ind_mo_01:
      kind: scalar
      type: "INTEGER"
      description: >-
        Monthly enrollment indicator. 12 elements, January to December. NOTE: scope differs by
        source. MAX = enrolled in Medicaid (including Medicaid-expansion CHIP); months enrolled
        ONLY in separate CHIP are 0, because MAX_ELG_CD has no separate-CHIP code. TAF =
        enrolled in Medicaid OR CHIP (ELGBLTY_GRP_CD 61-68 are CHIP groups, including separate
        CHIP). For a definition that is consistent across MAX and TAF, use chip_type_mo_* (see
        docs/max-taf/ps/findings/materialization.md).

        Codebook:
          0 = not eligible this month (MAX 00 or 99 = claims but no eligibility record; TAF blank --
            TAF leaves the code blank in months not enrolled -- or TAF 00, which is not in the TAF
            codebook value list)
          1 = eligible (MAX: any other code; TAF: a valid group code 01-09, 11-56, 59-76)
          NULL = MAX blank code / source variable absent (MAX 1999-2004, or a file without the
            column) / TAF code other than 00 outside the valid list

        Month-specific scalar version of `eligibility_month_ind` for January (month 01).
      month: 1
      source:
        - MAX_ELG_CD_MO_1
        - ELGBLTY_GRP_CD_01
      cast:
        "*": >
          CASE
            WHEN source_type = 'max' AND NULLIF(TRIM(CAST({column_name} AS VARCHAR)), '') IS NULL THEN NULL
            WHEN source_type = 'taf' AND NULLIF(TRIM(CAST({column_name} AS VARCHAR)), '') IS NULL THEN 0

            WHEN source_type = 'max' AND UPPER(LPAD(TRIM(CAST({column_name} AS VARCHAR)), 2, '0')) IN ('00', '99') THEN 0
            WHEN source_type = 'max' THEN 1

            WHEN source_type = 'taf' AND LPAD(TRIM(CAST({column_name} AS VARCHAR)), 2, '0') = '00' THEN 0
            WHEN source_type = 'taf' AND TRY_CAST(TRIM(CAST({column_name} AS VARCHAR)) AS INTEGER) BETWEEN 1 AND 76 AND TRY_CAST(TRIM(CAST({column_name} AS VARCHAR)) AS INTEGER) NOT IN (10, 57, 58) THEN 1

            ELSE NULL
          END
