          breast_cervical_cancer = breast and cervical cancer program eligibility
          hcbs_or_institutional = HCBS, institutional, or LTSS-related eligibility
          chip_child = CHIP child eligibility
          conception_to_birth = CHIP conception-to-birth eligibility
          chip_pregnancy = CHIP pregnancy eligibility
          section_1115_or_other_expansion = Section 1115 or other expansion eligibility
          limited_or_other = other, limited, or not otherwise classified eligibility
