        Month-specific scalar version of `eligibility_group_tmsis` for January (month 1).
        MAX-only companion to eligibility_group_mo_01.
      month: 1
      source:
        - TMSIS_ELG_GRP_MO_1
      type: VARCHAR
      cast:
        "*": >
          CASE
            WHEN NULLIF(TRIM(CAST({column_name} AS VARCHAR)), '') IS NULL THEN NULL
            WHEN LPAD(TRIM(CAST({column_name} AS VARCHAR)), 2, '0') = '99' THEN NULL

            WHEN LPAD(TRIM(CAST({column_name} AS VARCHAR)), 2, '0') = '00' THEN 'not_eligible'

            WHEN list_contains(['01', '02', '03', '04', '27', '33'], LPAD(TRIM(CAST({column_name} AS VARCHAR)), 2, '0')) THEN 'parent_caretaker'
            WHEN LPAD(TRIM(CAST({column_name} AS VARCHAR)), 2, '0') = '05' THEN 'pregnant'
            WHEN LPAD(TRIM(CAST({column_name} AS VARCHAR)), 2, '0') = '06' THEN 'deemed_newborn'
            WHEN LPAD(TRIM(CAST({column_name} AS VARCHAR)), 2, '0') IN ('07', '28', '31') THEN 'low_income_child'
            WHEN LPAD(TRIM(CAST({column_name} AS VARCHAR)), 2, '0') IN ('08', '29', '30') THEN 'foster_care_or_adoption'
            WHEN LPAD(TRIM(CAST({column_name} AS VARCHAR)), 2, '0') = '09' THEN 'former_foster_care'
            WHEN list_contains(['11', '12', '13', '14', '15', '17', '18', '37', '38', '40', '41', '46'], LPAD(TRIM(CAST({column_name} AS VARCHAR)), 2, '0')) THEN 'aged_or_disabled_cash_or_ssi'
            WHEN list_contains(['16', '19', '20', '21', '22'], LPAD(TRIM(CAST({column_name} AS VARCHAR)), 2, '0')) THEN 'disabled_cash_or_ssi'
            WHEN list_contains(['45', '47', '48', '49', '50'], LPAD(TRIM(CAST({column_name} AS VARCHAR)), 2, '0')) THEN 'disabled_other'
            WHEN LPAD(TRIM(CAST({column_name} AS VARCHAR)), 2, '0') IN ('23', '24', '25', '26') THEN 'medicare_savings_program'
            WHEN LPAD(TRIM(CAST({column_name} AS VARCHAR)), 2, '0') = '34' THEN 'breast_cervical_cancer'
            WHEN LPAD(TRIM(CAST({column_name} AS VARCHAR)), 2, '0') IN ('35', '70') THEN 'family_planning'
            WHEN list_contains(['39', '42', '43', '44', '51', '52'], LPAD(TRIM(CAST({column_name} AS VARCHAR)), 2, '0')) THEN 'hcbs_or_institutional'
            WHEN LPAD(TRIM(CAST({column_name} AS VARCHAR)), 2, '0') = '53' THEN 'pregnant_medically_needy'
            WHEN LPAD(TRIM(CAST({column_name} AS VARCHAR)), 2, '0') IN ('54', '55') THEN 'child_medically_needy'
            WHEN LPAD(TRIM(CAST({column_name} AS VARCHAR)), 2, '0') = '56' THEN 'adult_medically_needy'
            WHEN LPAD(TRIM(CAST({column_name} AS VARCHAR)), 2, '0') = '59' THEN 'aged_or_disabled_medically_needy'
            WHEN LPAD(TRIM(CAST({column_name} AS VARCHAR)), 2, '0') = '60' THEN 'disabled_medically_needy'
            WHEN list_contains(['61', '62', '63', '65', '66'], LPAD(TRIM(CAST({column_name} AS VARCHAR)), 2, '0')) THEN 'chip_child'
            WHEN LPAD(TRIM(CAST({column_name} AS VARCHAR)), 2, '0') = '64' THEN 'conception_to_birth'
            WHEN LPAD(TRIM(CAST({column_name} AS VARCHAR)), 2, '0') IN ('67', '68') THEN 'chip_pregnancy'
            WHEN LPAD(TRIM(CAST({column_name} AS VARCHAR)), 2, '0') IN ('69', '71') THEN 'section_1115_or_other_expansion'
            WHEN LPAD(TRIM(CAST({column_name} AS VARCHAR)), 2, '0') IN ('72', '73', '74', '75') THEN 'adult_expansion'
            WHEN LPAD(TRIM(CAST({column_name} AS VARCHAR)), 2, '0') IN ('32', '36', '76') THEN 'limited_or_other'

            ELSE 'limited_or_other'
          END
