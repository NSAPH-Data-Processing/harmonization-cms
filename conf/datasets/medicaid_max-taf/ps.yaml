  - restricted_benefits_mo_01:
      kind: scalar
      type: "VARCHAR"
      description: >-
        Monthly scope of Medicaid/CHIP benefits (restricted benefits code), raw code preserved
        as-is (not translated to a descriptive label). 12 elements, January to December. Source:
        MAX EL_RSTRCT_BNFT_FLG_N (RSTDBN1-RSTDBN12 in 1999-2004) / TAF RSTRCTD_BNFTS_CD_NN.

        Codebook:
          0 = not eligible for Medicaid or CHIP this month
          1 = full scope of benefits
          2 = restricted: alien status
          3 = restricted: Medicare dual eligibility (e.g. QMB only, SLMB only)
          4 = restricted: pregnancy-related services
          5 = restricted: other reasons (e.g. substance abuse, medically needy)
          6 = restricted: family planning services only (MAX from 2001)
          7 = alternative benchmark-equivalent benefit package (DRA 2005)
          A = Psychiatric Residential Treatment Facilities (PRTF) demonstration
          B = Health Opportunity Account (HOA)
          C = separate CHIP dental coverage only
          D = Money Follows the Person (MFP) demonstration (MAX code 8 recoded to D)
          9 = benefit restrictions unknown (MAX only; TAF leaves this NULL)
          W = premium assistance only, MA/NJ/OK/VT (MAX only)
          X = prescription drug benefits only (MAX only, 2003+)
          Y = Rx only + restricted dual benefits (MAX only, 2003+)
          Z = Rx only, Medicare-eligible but no restricted dual benefits (MAX only, 2003+)
          E = restricted: other reasons, not Minimum Essential Coverage (TAF only)
          F = restricted: COVID-19 testing only, PHE from 2020-03-18 (TAF only)
          G = restricted: Medicare dual, Part B-ID ESRD benefit (TAF only)
          NULL = missing source value / unrecognized value

        Month-specific scalar version of `restricted_benefits` for January (month 01).
      month: 1
      source:
        - EL_RSTRCT_BNFT_FLG_1
        - RSTRCTD_BNFTS_CD_01
        - RSTDBN1
      cast:
        "*": >
          CASE
            WHEN NULLIF(UPPER(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1))), '') IS NULL THEN NULL

            WHEN list_contains(['0', '1', '2', '3', '4', '5', '6', '7', 'A', 'B', 'C'], UPPER(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)))) THEN UPPER(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)))

