  - eligibility_group_tmsis_mo_11:
      kind: scalar
      type: "VARCHAR"
      description: >-
        Monthly T-MSIS-coded eligibility category, MAX 2014+ only, at the same full
        pathway-level detail as the primary `eligibility_group_mo_11` column. 12 elements,
        January to December.

        This is an independent, MAX-only companion to eligibility_group_mo_11, derived from
        TMSIS_ELG_GRP_MO_11 (new for MAX 2014) instead of the older MAX_ELG_CD_MO_11
        substring-coded field. TMSIS_ELG_GRP_MO uses the same eligibility group coding scheme as
        TAF's ELGBLTY_GRP_CD, so this column reuses the identical bucket-matching logic already
        applied to TAF data in eligibility_group_mo_11's TAF branch -- giving researchers an
        independent, TAF-consistent-scheme categorization to cross-check against the primary MAX
        substring-position derivation for years where both source fields exist (2014+).

        This is NULL for TAF years (no TMSIS_ELG_GRP_MO column in TAF's schema -- use
        eligibility_group_mo_11 directly for TAF data) and for pre-2014 MAX years
        (TMSIS_ELG_GRP_MO did not exist before MAX 2014).

        Deliberately NOT used to replace the primary eligibility_group_mo_11 /
        eligibility_month_ind_mo_11 derivation: several 2-character codes (e.g. 11, 12, 14, 21,
        41) are valid in BOTH the old MAX_ELG_CD_MO substring scheme and the new
        TMSIS_ELG_GRP_MO/TAF scheme, with DIFFERENT meanings in each (e.g. old-MAX 11 =
        Aged/Cash, T-MSIS 11 = SSI recipients/ABD). Since the harmonizer cannot currently tag
        which raw source column was selected for a given value (only source_type = max/taf is
        available inside element_cast, not which specific candidate in source_component_sets
        matched), auto-detecting the coding scheme from the code value alone is not reliably
        possible. Rather than risk silently misclassifying rows under the wrong scheme, this is
        kept as a separate, explicitly-MAX-2014+-only column.

        Codebook (same categories as eligibility_group_mo_11's TAF branch, minus 'unknown',
        which TMSIS_ELG_GRP_MO's real code list does not produce):
          not_eligible = not eligible in the month
          aged_or_disabled_cash_or_ssi = aged or disabled cash/SSI eligibility (T-MSIS does not split aged vs disabled at this code level)
          pregnant_medically_needy = pregnant, medically needy eligibility
          child_medically_needy = child, medically needy eligibility
          adult_medically_needy = adult, medically needy eligibility
          aged_or_disabled_medically_needy = aged or disabled, medically needy eligibility (T-MSIS does not split aged vs disabled at this code level)
          parent_caretaker = parent/caretaker or other adult eligibility
          pregnant = pregnancy-related eligibility
          deemed_newborn = deemed newborn eligibility
          low_income_child = low-income child eligibility
          foster_care_or_adoption = foster care or adoption assistance eligibility
          former_foster_care = former foster care eligibility
          adult_expansion = ACA adult expansion eligibility
          disabled_cash_or_ssi = disability-specific SSI-related eligibility (e.g. disabled adult children, 1619(b) working disabled)
          disabled_other = other disability-specific eligibility (e.g. qualified disabled children, Ticket to Work, Family Opportunity Act)
          disabled_medically_needy = medically needy blind or disabled
          medicare_savings_program = Medicare Savings Program eligibility
          family_planning = family planning-only eligibility
          breast_cervical_cancer = breast and cervical cancer program eligibility
          hcbs_or_institutional = HCBS, institutional, or LTSS-related eligibility
          chip_child = CHIP child eligibility
          conception_to_birth = CHIP conception-to-birth eligibility
          chip_pregnancy = CHIP pregnancy eligibility
          section_1115_or_other_expansion = Section 1115 or other expansion eligibility
          limited_or_other = other, limited, or not otherwise classified eligibility
          NULL = missing source value, TAF row, pre-2014 MAX row, or TMSIS_ELG_GRP_MO = 99 (default value in a dummy MAX PS record, per the MAX dictionary -- not a real eligibility observation)

