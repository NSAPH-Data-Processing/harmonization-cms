  - medicaid_enrollment_days_mo_01:
      kind: scalar
      type: "INTEGER"
      description: >-
        Monthly days enrolled in Medicaid, including Medicaid-expansion CHIP (same scope in
        MAX and TAF). 12 elements, January to December. Separate-CHIP days are in
        `chip_enrollment_days_mo_*`. For total Medicaid-or-CHIP days, add the two and cap at
        the month's length (a TAF month can have both, chip_type 4).

        Codebook:
          0 to number of days in the month
          NULL = missing source value / out-of-range value / MAX 1999-2004 if the file
            lacks EL_DAYS_EL_CNT_N (no short name in the MAX crosswalk)

        MAX 0-fills people with claims but no eligibility record (MAX_ELG_CD 99).

        Month-specific scalar version of `medicaid_enrollment_days` for January (month 01).
      month: 1
      source:
        - EL_DAYS_EL_CNT_1
        - MDCD_ENRLMT_DAYS_01
      cast:
        "*": >
          CASE
            WHEN TRY_CAST(NULLIF(TRIM(CAST({column_name} AS VARCHAR)), '') AS DOUBLE) IS NULL THEN NULL
            WHEN TRY_CAST(NULLIF(TRIM(CAST({column_name} AS VARCHAR)), '') AS DOUBLE) BETWEEN 0 AND DAY(LAST_DAY(MAKE_DATE({year}, 1, 1))) THEN CAST(TRY_CAST(NULLIF(TRIM(CAST({column_name} AS VARCHAR)), '') AS DOUBLE) AS INTEGER)
            ELSE NULL
          END
