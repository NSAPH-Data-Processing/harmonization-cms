table_name: ip
description: >-
  Medicaid MAX-TAF inpatient (IP) files. A MAX row is a hospital stay (CMS already combined its
  claims); a TAF row is one claim. The `rollup` block combines TAF claims into MAX-style stays
  (in progress). Decisions: docs/max-taf/ip/decisions.md.

path_pattern:
  - "{basepath}/{year}/taf_inpatient_header_res000017155_req013731/part-*.parquet"
  - "{basepath}/{year}/maxdata_*_ip/part-*.parquet"

# TAF claims -> stays (harmonizecms/stays.py). Built in steps; not hooked into the harmonizer yet.
rollup:
  rows: "source_type = 'taf'"
  filters:
    # Service tracking claims: not in MAX (IP-R08). NULL claim type is kept.
    - "claim_type_cd IS NULL OR claim_type_cd NOT IN ('4', 'D', 'X')"
    # Illinois provider lump sums (IP-R11)
    - "state IS DISTINCT FROM 'IL' OR claim_type_cd IS DISTINCT FROM 'Y'"
  # Illinois sends adjustments as extra records; each family is netted into one claim
  # (IP-R11, IP-R43; rules in docs/max-taf/ip/findings/illinois.md).
  claim_families:
    rows: "state = 'IL'"
    key: [state, msis_id, billing_provider_id, claim_num_orig]
    original: "claim_num_adj IS NULL"  # sorts first
    order: "adjudication_date NULLS LAST, claim_id"  # then by this
    amount_fallbacks:
      mdcd_pymt_amt: srvc_trkng_pymt_amt  # used when the payment is 0 or NULL
  family_columns: [claim_num_orig, claim_num_adj, adjudication_date, srvc_trkng_pymt_amt]  # dropped after netting
  final_action_filters:
    # MAX drops FFS claims paid $0 unless Medicare or TPL paid something (IP-R12, IP-R20)
    - >-
      NOT COALESCE(claim_type_cd IN ('1', 'A') AND mdcd_pymt_amt = 0
        AND NOT (COALESCE(mdcr_coinsur_pymt_amt, 0) > 0 OR COALESCE(mdcr_ded_pymt_amt, 0) > 0
                 OR COALESCE(tp_pymt_amt, 0) > 0), FALSE)

columns:
  - bene_id:
      source:
        - BENE_ID
      type: VARCHAR
      cast:
        "*": "TRY_CAST({column_name} AS VARCHAR)"
  - msis_id:
      description: State-assigned person ID; unique only within a state.
      source:
        - MSIS_ID
      type: VARCHAR
      cast:
        "*": "TRY_CAST({column_name} AS VARCHAR)"
  - claim_id:
      description: TAF claim ID. NULL for MAX (rows are already stays).
      source:
        - CLM_ID
      type: VARCHAR
      cast:
        "*": "TRY_CAST({column_name} AS VARCHAR)"

  - year:
      description: >-
        File year, from the path. A late-December stay can sit in the next year's file. For TAF
        stays the rollup will set it to the discharge year (IP-R05).
      source:
        - source_filename
      type: INT
      cast:
        "*": "TRY_CAST(regexp_extract({column_name}, '/([0-9]{{4}})/', 1) AS INT)"
  - raw_filename:
      source:
        - source_filename
      type: VARCHAR
      cast:
        "*": "TRY_CAST({column_name} AS VARCHAR)"
  - source_type:
      source:
        - source_filename
      type: VARCHAR
      cast:
        "*": |
          CASE
            WHEN lower({column_name}) LIKE '%maxdata_%' THEN 'max'
            WHEN lower({column_name}) LIKE '%taf_%' THEN 'taf'
            ELSE NULL
          END
  - state:
      description: Two-letter postal code of the submitting state.
      source:
        - STATE_CD
        - STATE
      type: VARCHAR
      cast:
        "*": "TRY_CAST({column_name} AS VARCHAR)"
  - admission_date:
      source:
        - ADMSN_DT
        - DT_ADMT
      type: DATE
      cast:
        "*": "TRY_CAST({column_name} AS DATE)"
  - srvc_bgn_dt:
      description: First service date; not always the admission date.
      source:
        - SRVC_BGN_DT
        - DT_BEG
      type: DATE
      cast:
        "*": "TRY_CAST({column_name} AS DATE)"
  - srvc_end_dt:
      description: Last service date; not always the discharge date (read with patient_status_cd).
      source:
        - SRVC_END_DT
        - DT_DSCH
      type: DATE
      cast:
        "*": "TRY_CAST({column_name} AS DATE)"
  - patient_status_cd:
      description: >-
        Discharge status (NUBC 2-digit code, same in MAX and TAF). Numeric reads are cleaned
        ("1.0" -> "01"). MAX 99 (unknown) -> NULL.
      source:
        - PATIENT_STATUS_CD
        - PTNT_DSCHRG_STUS_CD
        - PAT_STAT
      type: VARCHAR
      cast:
        "*": |
          CASE
            WHEN NULLIF(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), '') IS NULL THEN NULL
            WHEN LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0') = '99' THEN NULL
            ELSE LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0')
          END
  - claim_type_cd:
      description: >-
        Payment type: 1/A FFS, 2/B capitation, 3/C encounter, 4/D service tracking,
        5/E supplemental (letters = separate CHIP). Codes match across MAX and TAF; TAF also has
        U/V/W/X/Y (neither Medicaid nor CHIP). MAX 9 (unknown) -> NULL. MAX excludes service
        tracking claims; TAF RIFs include 4/D/X from Aug 2021, and the rollup drops them (IP-R08).
      source:
        - TYPE_CLM_CD
        - CLM_TYPE_CD
        - TYP_CLA
      type: VARCHAR
      cast:
        "*": |
          CASE
            WHEN NULLIF(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), '') IS NULL THEN NULL
            WHEN source_type = 'max' AND TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)) = '9' THEN NULL
            ELSE TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1))
          END
  - adjustment_cd:
      description: >-
        0 = original only; 1 = adjusted (MAX 1, TAF 2-6); 2 = MAX only, no original found, stay
        may be incomplete; NULL = TAF void (1), missing or other.
      source:
        - ADJUSTMENT_CODE
        - ADJUST_CD
        - ADJ_CODE
      type: VARCHAR
      cast:
        "*": |
          CASE
            WHEN TRY_CAST({column_name} AS DOUBLE) = 0 THEN '0'
            WHEN source_type = 'max' AND TRY_CAST({column_name} AS DOUBLE) = 1 THEN '1'
            WHEN source_type = 'max' AND TRY_CAST({column_name} AS DOUBLE) = 2 THEN '2'
            WHEN source_type = 'taf' AND TRY_CAST({column_name} AS DOUBLE) IN (2, 3, 4, 5, 6) THEN '1'
            ELSE NULL
          END
  - primary_diagnosis:
      description: >-
        Principal diagnosis (= diagnoses[1]). Uppercased, spaces and periods removed. Some MAX
        ICD-9 codes keep state zero-padding (40100 for 4010).
      source:
        - DGNS_CD_1
        - DIAG_CD_1
        - DIAG_1
      type: VARCHAR
      cast:
        "*": "NULLIF(UPPER(REGEXP_REPLACE(CAST({column_name} AS VARCHAR), '[^A-Za-z0-9]', '', 'g')), '')"
  - diagnoses:
      kind: array
      type: "VARCHAR[]"
      description: >-
        Diagnosis codes, cleaned like primary_diagnosis. MAX has 9 positions, TAF 12; use
        diagnoses[1:9] when comparing the two.
      source_component_sets:
        - [DIAG_CD_1, DIAG_CD_2, DIAG_CD_3, DIAG_CD_4, DIAG_CD_5, DIAG_CD_6, DIAG_CD_7, DIAG_CD_8, DIAG_CD_9]
        - [DGNS_CD_1, DGNS_CD_2, DGNS_CD_3, DGNS_CD_4, DGNS_CD_5, DGNS_CD_6, DGNS_CD_7, DGNS_CD_8, DGNS_CD_9, DGNS_CD_10, DGNS_CD_11, DGNS_CD_12]
        - [DIAG_1, DIAG_2, DIAG_3, DIAG_4, DIAG_5, DIAG_6, DIAG_7, DIAG_8, DIAG_9]
      element_cast: "NULLIF(UPPER(REGEXP_REPLACE(CAST({column_name} AS VARCHAR), '[^A-Za-z0-9]', '', 'g')), '')"
      cast:
        "*": "{column_name}"
  - diagnosis_version_cds:
      kind: array
      type: "VARCHAR[]"
      description: ICD version of diagnoses[i] ('9' or '10'); NULL if missing or invalid.
      source_component_sets:
        - [DIAG_CD_FLG_1, DIAG_CD_FLG_2, DIAG_CD_FLG_3, DIAG_CD_FLG_4, DIAG_CD_FLG_5, DIAG_CD_FLG_6, DIAG_CD_FLG_7, DIAG_CD_FLG_8, DIAG_CD_FLG_9]
        - [DGNS_VRSN_CD_1, DGNS_VRSN_CD_2, DGNS_VRSN_CD_3, DGNS_VRSN_CD_4, DGNS_VRSN_CD_5, DGNS_VRSN_CD_6, DGNS_VRSN_CD_7, DGNS_VRSN_CD_8, DGNS_VRSN_CD_9, DGNS_VRSN_CD_10, DGNS_VRSN_CD_11, DGNS_VRSN_CD_12]
      element_cast: >-
        CASE
          WHEN NULLIF(TRIM(CAST({column_name} AS VARCHAR)), '') IS NULL THEN NULL
          WHEN source_type = 'max' AND TRY_CAST({column_name} AS DOUBLE) = 0 THEN '10'
          WHEN source_type = 'max' AND TRY_CAST({column_name} AS DOUBLE) = 9 THEN '9'
          WHEN source_type = 'taf' AND TRY_CAST({column_name} AS DOUBLE) = 1 THEN '9'
          WHEN source_type = 'taf' AND TRY_CAST({column_name} AS DOUBLE) = 2 THEN '10'
          ELSE NULL
        END
      cast:
        "*": "{column_name}"

  - procedures:
      kind: array
      type: "VARCHAR[]"
      description: Procedure codes (6 positions), cleaned like diagnoses.
      source_component_sets:
        - [PRCDR_CD_1, PRCDR_CD_2, PRCDR_CD_3, PRCDR_CD_4, PRCDR_CD_5, PRCDR_CD_6]
        - [PROC1, PROC2, PROC3, PROC4, PROC5, PROC6]
      element_cast: "NULLIF(UPPER(REGEXP_REPLACE(CAST({column_name} AS VARCHAR), '[^A-Za-z0-9]', '', 'g')), '')"
      cast:
        "*": "{column_name}"
  - procedure_coding_system:
      kind: array
      type: "VARCHAR[]"
      description: >-
        Coding system of procedures[i], 2 digits: 01 CPT-4, 02 ICD-9-CM, 06 HCPCS,
        07 ICD-10-PCS, 10-87 other. MAX 88 and 99 -> NULL.
      source_component_sets:
        - [PRCDR_CD_SYS_1, PRCDR_CD_SYS_2, PRCDR_CD_SYS_3, PRCDR_CD_SYS_4, PRCDR_CD_SYS_5, PRCDR_CD_SYS_6]
        - [PROCIND1, PROCIND2, PROCIND3, PROCIND4, PROCIND5, PROCIND6]
      element_cast: >-
        CASE
          WHEN NULLIF(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), '') IS NULL THEN NULL
          WHEN source_type = 'max' AND LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0') IN ('88', '99') THEN NULL
          ELSE LPAD(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), 2, '0')
        END
      cast:
        "*": "{column_name}"
  - mdcd_cvrd_days:
      description: >-
        Medicaid-covered days. MAX sets 0 for stays with a Medicare crossover claim and caps at
        365; the rollup will do the same for TAF stays (IP-R29).
      source:
        - MDCD_CVRD_IP_DAYS
        - CVRD_DAYS
        - IP_DAYS
      type: INT
      cast:
        "*": "TRY_CAST({column_name} AS INT)"
  - mdcd_pymt_amt:
      description: >-
        Medicaid (or plan) payment. Encounters (3/C/W): TAF redacts it (NULL), MAX reports $0;
        neither means no payment. Can be negative.
      source:
        - MDCD_PD_AMT
        - MDCD_PYMT_AMT
        - AMT_PAID
      type: DOUBLE
      cast:
        "*": "TRY_CAST({column_name} AS DOUBLE)"
  - tp_pymt_amt:
      description: >-
        Third-party liability paid (e.g. private insurance). Under-reported in some states; treat
        as a lower bound. Not redacted on encounters. Can be negative.
      source:
        - TP_PYMT_AMT
        - TP_PD_AMT
        - OTP_PAY
      type: DOUBLE
      cast:
        "*": "TRY_CAST({column_name} AS DOUBLE)"
  - mdcr_coinsur_pymt_amt:
      description: Medicaid payment toward Medicare coinsurance. Redacted on TAF encounters. Can be negative.
      source:
        - MDCR_COINSUR_PYMT_AMT
        - MDCR_COINSRNC_PD_AMT
      type: DOUBLE
      cast:
        "*": "TRY_CAST({column_name} AS DOUBLE)"
  - mdcr_ded_pymt_amt:
      description: Medicaid payment toward the Medicare deductible. Redacted on TAF encounters. Can be negative.
      source:
        - MDCR_DED_PYMT_AMT
        - MDCR_DDCTBL_PD_AMT
      type: DOUBLE
      cast:
        "*": "TRY_CAST({column_name} AS DOUBLE)"
  - drg_rel_group:
      description: >-
        DRG code as reported, not always a CMS DRG (see drg_rel_group_ind). No padding added.
        MAX 8888 (no DRG system) and 9999 (unknown) -> NULL.
      source:
        - DRG_REL_GROUP
        - DRG_CD
        - DRG
      type: VARCHAR
      cast:
        "*": |
          CASE
            WHEN TRY_CAST({column_name} AS DOUBLE) IN (8888, 9999) THEN NULL
            WHEN NULLIF(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), '') IS NULL THEN NULL
            ELSE TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1))
          END
  - drg_rel_group_ind:
      description: >-
        Grouper behind drg_rel_group: 2-letter system (state code, HG = CMS Grouper, XX = other)
        + 2-digit version (99 = unknown), e.g. HG33. MAX 8888 and 9999 -> NULL.
      source:
        - DRG_REL_GROUP_IND
        - DRG_CD_SYS
        - DRG_IND
      type: VARCHAR
      cast:
        "*": |
          CASE
            WHEN NULLIF(TRIM(CAST({column_name} AS VARCHAR)), '') IS NULL THEN NULL
            WHEN TRIM(CAST({column_name} AS VARCHAR)) IN ('8888', '9999') THEN NULL
            ELSE TRIM(CAST({column_name} AS VARCHAR))
          END
  - billing_provider_id:
      description: >-
        State billing provider ID, trimmed. Unique only within a state; may change at the
        MAX-to-TAF switch. Part of the stay link key.
      source:
        - PRVDR_ID_NMBR
        - BLG_PRVDR_ID
        - B_PROVID
      type: VARCHAR
      cast:
        "*": "NULLIF(TRIM(CAST({column_name} AS VARCHAR)), '')"
  - billing_npi:
      description: >-
        Billing provider NPI. Kept only if 10 digits and not 9999999996 (IP-R39). MAX has it
        from 2005 (9-filled 2005-2008). Links TAF claims that have no state provider ID.
      source:
        - BLG_PRVDR_NPI
        - NPI
      type: VARCHAR
      cast:
        "*": |
          CASE
            WHEN regexp_full_match(regexp_replace(TRIM(CAST({column_name} AS VARCHAR)), '\.0+$', ''), '[0-9]{{10}}')
              AND regexp_replace(TRIM(CAST({column_name} AS VARCHAR)), '\.0+$', '') <> '9999999996'
              THEN regexp_replace(TRIM(CAST({column_name} AS VARCHAR)), '\.0+$', '')
            ELSE NULL
          END

  # Helper columns for the rollup (TAF only; NULL for MAX)
  - claim_num_orig:
      description: Original claim number; groups an Illinois claim with its adjustments.
      source:
        - CLM_NUM_ORIG
      type: VARCHAR
      cast:
        "*": "NULLIF(TRIM(CAST({column_name} AS VARCHAR)), '')"
  - claim_num_adj:
      description: Adjustment claim number; NULL on the original record.
      source:
        - CLM_NUM_ADJ
      type: VARCHAR
      cast:
        "*": "NULLIF(TRIM(CAST({column_name} AS VARCHAR)), '')"
  - adjudication_date:
      description: Orders the records of an Illinois claim family.
      source:
        - ADJDCTN_DT
      type: DATE
      cast:
        "*": "TRY_CAST({column_name} AS DATE)"
  - srvc_trkng_pymt_amt:
      description: Service tracking payment; Illinois sometimes puts the claim's payment here.
      source:
        - SRVC_TRKNG_PYMT_AMT
      type: DOUBLE
      cast:
        "*": "TRY_CAST({column_name} AS DOUBLE)"
  - srvc_end_dt_cd:
      description: >-
        Where SRVC_END_DT came from: 1 = discharge date, 4 = last line end date, 5 = last line
        begin date. Decides whether the end date can link claims (IP-R37).
      source:
        - SRVC_END_DT_CD
      type: VARCHAR
      cast:
        "*": "NULLIF(TRIM(SPLIT_PART(CAST({column_name} AS VARCHAR), '.', 1)), '')"
  - crossover_clm_ind:
      description: Medicare crossover claim, '0' or '1' (IP-R29).
      source:
        - CROSSOVER_CLM_IND
      type: VARCHAR
      cast:
        "*": |
          CASE
            WHEN TRY_CAST({column_name} AS DOUBLE) = 0 THEN '0'
            WHEN TRY_CAST({column_name} AS DOUBLE) = 1 THEN '1'
            ELSE NULL
          END
  - prsn_clm_ind:
      description: >-
        1 = claim for a person; 0 = missing or "&" MSIS ID, service tracking, or no claim type
        (IP-R34). NULL in older RIF releases.
      source:
        - PRSN_CLM_IND
      type: INT
      cast:
        "*": |
          CASE
            WHEN TRY_CAST({column_name} AS DOUBLE) = 0 THEN 0
            WHEN TRY_CAST({column_name} AS DOUBLE) = 1 THEN 1
            ELSE NULL
          END
